<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--ARTIFACT:BEGIN-->
<title>Первинка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;600&display=swap">
<style>
/* ============================================================
   Первинка — прототип бек-офісу первинної документації
   Палітра: канцелярське чорнило (синій зсув) + штамповий червоний.
   Акцент AI — окремий фіолетовий, більше ніде не використовується.
   ============================================================ */
:root{
  --paper:#F4F6F9;      /* холодний папір */
  --surface:#FFFFFF;
  --surface-2:#FBFCFD;
  --sunken:#EDF1F5;
  --line:#DBE2EA;       /* лінійка реєстру */
  --line-strong:#BFCAD6;
  --ink:#16202B;        /* чорнило */
  --ink-2:#4A5A6B;
  --ink-3:#78889A;
  --accent:#1F5FA9;     /* синій офіційного бланка */
  --accent-soft:#E7EFF9;
  --accent-ink:#154880;
  --ok:#1E7A4E;   --ok-soft:#E4F2EA;
  --warn:#9A6510; --warn-soft:#FBF0DC;
  --crit:#AE2F29; --crit-soft:#FAE7E5;
  --ai:#63479C;   --ai-soft:#EFEAF8;   /* єдина мітка AI на весь продукт */
  --focus:#1F5FA9;
  --radius:5px;
  --shadow:0 1px 2px rgba(22,32,43,.06), 0 8px 24px rgba(22,32,43,.08);
  --sans:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Consolas,monospace;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11161C; --surface:#171E26; --surface-2:#1B232C; --sunken:#131A21;
    --line:#2A343F; --line-strong:#3B4854;
    --ink:#E7ECF2; --ink-2:#A9B6C4; --ink-3:#7D8B99;
    --accent:#6FA8E8; --accent-soft:#1B2C3F; --accent-ink:#9CC5F2;
    --ok:#57C08A; --ok-soft:#16301F;
    --warn:#DFA850; --warn-soft:#332612;
    --crit:#E58279; --crit-soft:#37201E;
    --ai:#AB92E0; --ai-soft:#241C38;
    --focus:#6FA8E8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161C; --surface:#171E26; --surface-2:#1B232C; --sunken:#131A21;
  --line:#2A343F; --line-strong:#3B4854;
  --ink:#E7ECF2; --ink-2:#A9B6C4; --ink-3:#7D8B99;
  --accent:#6FA8E8; --accent-soft:#1B2C3F; --accent-ink:#9CC5F2;
  --ok:#57C08A; --ok-soft:#16301F;
  --warn:#DFA850; --warn-soft:#332612;
  --crit:#E58279; --crit-soft:#37201E;
  --ai:#AB92E0; --ai-soft:#241C38;
  --focus:#6FA8E8;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 13.5px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:3px}
[hidden]{display:none !important}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.u{text-transform:uppercase; letter-spacing:.07em; font-size:10.5px; font-weight:600; color:var(--ink-3)}

/* ---------- каркас ---------- */
.app{display:grid; grid-template-columns:214px 1fr; grid-template-rows:auto 1fr; height:100vh; min-height:0}
.topbar{
  grid-column:1/-1; display:flex; align-items:center; gap:14px;
  padding:0 14px; height:50px; background:var(--surface);
  border-bottom:1px solid var(--line); position:relative; z-index:20;
}
.brand{display:flex; align-items:baseline; gap:8px; width:200px; flex:none}
.brand b{font-size:15px; font-weight:700; letter-spacing:-.01em}
.brand span{font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.08em}
.searchwrap{flex:1; max-width:460px; position:relative}
.searchwrap input{
  width:100%; padding:6px 10px 6px 28px; background:var(--sunken);
  border:1px solid transparent; border-radius:var(--radius); color:var(--ink);
}
.searchwrap input::placeholder{color:var(--ink-3)}
.searchwrap input:focus{background:var(--surface); border-color:var(--line-strong); outline:none}
.searchwrap .mag{position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--ink-3); font-size:12px}
.searchwrap .kbd{position:absolute; right:7px; top:50%; transform:translateY(-50%)}
.kbd{
  font:500 10px/1.6 var(--mono); padding:1px 5px; border:1px solid var(--line-strong);
  border-bottom-width:2px; border-radius:3px; color:var(--ink-3); background:var(--surface); white-space:nowrap;
}
.spacer{flex:1}
.pick{
  display:flex; align-items:center; gap:6px; padding:5px 9px; background:transparent;
  border:1px solid var(--line); border-radius:var(--radius); cursor:pointer;
}
.pick:hover{border-color:var(--line-strong)}
.pick small{color:var(--ink-3); font-size:11px}
.killswitch{
  display:flex; align-items:center; gap:7px; padding:5px 10px; cursor:pointer;
  border:1px solid var(--crit); color:var(--crit); background:transparent; border-radius:var(--radius); font-weight:600;
}
.killswitch:hover{background:var(--crit-soft)}
.killswitch.off{border-color:var(--line-strong); color:var(--ink-2)}

.rail{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:10px 8px; gap:2px; overflow-y:auto; min-height:0;
}
.rail .u{padding:12px 8px 5px}
.navitem{
  display:flex; align-items:center; gap:9px; width:100%; padding:6px 9px; border:0;
  background:transparent; border-radius:var(--radius); cursor:pointer; text-align:left; color:var(--ink-2);
}
.navitem:hover{background:var(--sunken); color:var(--ink)}
.navitem[aria-current="page"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.navitem .ico{width:16px; text-align:center; flex:none; font-size:13px; opacity:.85}
.navitem .cnt{margin-left:auto; font:500 11px/1 var(--mono); color:var(--ink-3)}
.navitem .cnt.hot{color:var(--crit); font-weight:600}
.navitem[aria-current="page"] .cnt{color:var(--accent-ink)}

.main{overflow:auto; min-height:0; display:flex; flex-direction:column}
.screen{display:none; flex-direction:column; flex:1; min-height:0}
.screen.on{display:flex}

.shead{
  display:flex; align-items:flex-end; gap:14px; padding:14px 18px 11px;
  border-bottom:1px solid var(--line); background:var(--surface); flex:none; flex-wrap:wrap;
}
.shead h1{margin:0; font-size:17px; font-weight:600; letter-spacing:-.015em}
.shead .sub{color:var(--ink-3); font-size:12px; margin-top:2px}
.statepick{display:flex; align-items:center; gap:6px; margin-left:auto}
.statepick select{
  padding:4px 7px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
}
.body{flex:1; min-height:0; overflow:auto; padding:16px 18px 28px}
.body.flush{padding:0; display:flex; min-height:0}

/* ---------- атоми ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--radius);
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  cursor:pointer; font-weight:500; white-space:nowrap;
}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.btn.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink)}
.btn.quiet{border-color:transparent; background:transparent; color:var(--accent-ink)}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.danger{border-color:var(--crit); color:var(--crit)}
.btn.danger:hover{background:var(--crit-soft)}
.btn.sm{padding:3px 8px; font-size:12px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.btn.busy{pointer-events:none; opacity:.75}

.badge{
  display:inline-flex; align-items:center; gap:5px; padding:1.5px 7px; border-radius:20px;
  font-size:11.5px; font-weight:500; border:1px solid transparent; white-space:nowrap;
}
.badge .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.b-ok{background:var(--ok-soft); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.b-warn{background:var(--warn-soft); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.b-crit{background:var(--crit-soft); color:var(--crit); border-color:color-mix(in srgb,var(--crit) 25%,transparent)}
.b-info{background:var(--accent-soft); color:var(--accent-ink); border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.b-mute{background:var(--sunken); color:var(--ink-2); border-color:var(--line)}

.ai{
  display:inline-flex; align-items:center; gap:4px; padding:0 5px; height:16px; border-radius:3px;
  background:var(--ai-soft); color:var(--ai); border:1px solid color-mix(in srgb,var(--ai) 28%,transparent);
  font:600 9.5px/1 var(--sans); letter-spacing:.06em; cursor:pointer; vertical-align:middle; user-select:none;
}
.ai:hover{filter:brightness(.95)}
.ai::before{content:"◆"; font-size:7px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius)}
.card .ch{padding:10px 13px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
.card .ch h3{margin:0; font-size:13px; font-weight:600}
.card .cb{padding:13px}
.grid{display:grid; gap:12px}
.note{
  padding:9px 12px; border-radius:var(--radius); border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink-2); font-size:12.5px;
}
.note.warn{background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 30%,transparent); color:var(--ink)}
.note.crit{background:var(--crit-soft); border-color:color-mix(in srgb,var(--crit) 30%,transparent); color:var(--ink)}
.note.info{background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 25%,transparent); color:var(--ink)}
.note b{font-weight:600}

/* ---------- таблиця-реєстр ---------- */
.tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface)}
table.tbl{border-collapse:separate; border-spacing:0; width:100%; font-size:12.5px}
table.tbl th{
  position:sticky; top:0; z-index:2; background:var(--surface-2); text-align:left;
  padding:7px 10px; border-bottom:1px solid var(--line-strong); font-weight:600; font-size:11px;
  text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); white-space:nowrap;
}
table.tbl th.r,table.tbl td.r{text-align:right}
table.tbl td{padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
table.tbl tbody tr:hover td{background:var(--surface-2)}
table.tbl tbody tr[aria-selected="true"] td{background:var(--accent-soft)}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl .idc{font-family:var(--mono); font-weight:500; white-space:nowrap}
table.tbl.dense td{padding:4px 10px}
.trunc{max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block}

.toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:11px}
.views{display:flex; gap:4px; flex-wrap:wrap}
.view{
  padding:4px 10px; border:1px solid var(--line); background:var(--surface);
  border-radius:20px; cursor:pointer; font-size:12px; color:var(--ink-2);
}
.view:hover{border-color:var(--line-strong)}
.view[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:600}
.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:2.5px 6px 2.5px 9px;
  border:1px solid var(--line-strong); border-radius:20px; background:var(--surface); font-size:12px;
}
.chip button{border:0; background:transparent; cursor:pointer; color:var(--ink-3); padding:0 2px; line-height:1}
.chip button:hover{color:var(--crit)}
.count{color:var(--ink-3); font-size:12px; margin-left:auto}

.bulkbar{
  display:flex; align-items:center; gap:9px; padding:8px 12px; margin-bottom:11px;
  background:var(--ink); color:var(--paper); border-radius:var(--radius); flex-wrap:wrap;
}
.bulkbar .btn{background:transparent; border-color:rgba(255,255,255,.35); color:var(--paper)}
.bulkbar .btn:hover{background:rgba(255,255,255,.12)}
.bulkbar b{font-weight:600}

/* ---------- майстер-деталь ---------- */
.split{display:grid; grid-template-columns:minmax(330px,410px) 1fr; flex:1; min-height:0}
.split>.left{border-right:1px solid var(--line); overflow-y:auto; background:var(--surface); min-height:0}
.split>.right{overflow-y:auto; min-height:0; background:var(--paper)}
.seg{display:flex; gap:2px; padding:9px 11px; border-bottom:1px solid var(--line); flex-wrap:wrap; position:sticky; top:0; background:var(--surface); z-index:3}
.segbtn{
  padding:4px 9px; border:0; background:transparent; border-radius:var(--radius);
  cursor:pointer; font-size:12px; color:var(--ink-2); display:flex; gap:6px; align-items:center;
}
.segbtn:hover{background:var(--sunken)}
.segbtn[aria-pressed="true"]{background:var(--sunken); color:var(--ink); font-weight:600}
.segbtn i{font-style:normal; font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.segbtn.alarm i{color:var(--crit); font-weight:600}

.qrow{
  display:flex; flex-direction:column; align-items:stretch; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line);
  background:transparent; padding:10px 12px; cursor:pointer; border-left:3px solid transparent;
}
.qrow:hover{background:var(--surface-2)}
.qrow[aria-selected="true"]{background:var(--accent-soft); border-left-color:var(--accent)}
.qrow .l1{display:flex; align-items:baseline; gap:8px}
.qrow .l1 .doc{font-family:var(--mono); font-weight:500; font-size:12.5px}
.qrow .l1 .sum{margin-left:auto; font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600}
.qrow .l2{color:var(--ink-2); font-size:12px; margin-top:2px; display:flex; gap:7px; align-items:center}
.qrow .l3{margin-top:6px; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.qrow .age{color:var(--ink-3); font-size:11px; font-family:var(--mono)}
.qrow .age.late{color:var(--crit); font-weight:600}

/* ---------- факсиміле документа ---------- */
.verify{display:grid; grid-template-columns:minmax(300px,44%) 1fr; flex:1; min-height:0}
.vleft{border-right:1px solid var(--line); background:var(--sunken); overflow:auto; padding:14px; min-height:0}
.vright{overflow:auto; min-height:0; padding:14px 16px 0}
.scan{
  background:#fff; color:#1a1a1a; font-family:var(--serif); font-size:11.5px; line-height:1.45;
  padding:20px 22px; box-shadow:var(--shadow); border:1px solid var(--line); max-width:560px; margin:0 auto;
}
.scan h4{margin:0 0 3px; font-size:14px; text-align:center; font-weight:600}
.scan .meta{text-align:center; font-size:10.5px; color:#555; margin-bottom:11px}
.scan .party{margin:7px 0; font-size:11px}
.scan table{width:100%; border-collapse:collapse; margin:9px 0; font-size:10.5px}
.scan th,.scan td{border:1px solid #999; padding:3px 4px; text-align:left}
.scan th{background:#eee; font-weight:600; font-size:9.5px}
.scan td.r,.scan th.r{text-align:right; font-family:var(--mono)}
.scan .tot{text-align:right; margin-top:7px; font-size:11px}
.scan .sig{display:flex; justify-content:space-between; margin-top:16px; font-size:10px; color:#555}
.scan mark{background:#FFF0A8; padding:0 1px; border-radius:2px}
.scan .hl{background:#CFE4FA; outline:1.5px solid #1F5FA9; border-radius:2px}
.scanbar{display:flex; gap:6px; align-items:center; margin-bottom:10px; flex-wrap:wrap}

.fields{display:flex; flex-direction:column; gap:14px}
.fgroup{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface)}
.fgroup>header{padding:8px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px}
.fgroup>header h3{margin:0; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3)}
.frow{display:grid; grid-template-columns:150px 1fr; gap:10px; padding:6px 12px; align-items:baseline}
.frow+.frow{border-top:1px solid var(--line)}
.frow>dt{color:var(--ink-2); font-size:12px}
.frow>dd{margin:0; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.fval{
  border:1px solid transparent; border-radius:3px; padding:1px 5px; margin:-1px -5px; cursor:text;
  background:transparent;
}
.fval:hover{border-color:var(--line-strong); background:var(--surface-2)}
.fval:focus{border-color:var(--accent); background:var(--surface); outline:none}
dl{margin:0}

.lines{width:100%; border-collapse:separate; border-spacing:0; font-size:12px}
.lines th{background:var(--surface-2); padding:6px 8px; text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); border-bottom:1px solid var(--line-strong); font-weight:600}
.lines td{padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top}
.lines tr.need td{background:var(--warn-soft)}
.lines tr.need td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.lines .r{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.lines select{max-width:100%; padding:2px 5px; border:1px solid var(--line-strong); border-radius:3px; background:var(--surface); font-size:12px}
.raw{color:var(--ink-3); font-size:11px; display:block; margin-top:2px}
.acct{font-family:var(--mono); font-size:11.5px; color:var(--accent-ink); background:var(--accent-soft); padding:0 4px; border-radius:3px}

.actionbar{
  position:sticky; bottom:0; margin:14px -16px 0; padding:11px 16px;
  background:var(--surface); border-top:1px solid var(--line-strong);
  display:flex; gap:9px; align-items:center; flex-wrap:wrap; box-shadow:0 -3px 12px rgba(22,32,43,.05);
}
.actionbar .gapme{flex:1}

/* ---------- канбан ---------- */
.board{display:flex; gap:11px; align-items:flex-start; overflow-x:auto; padding-bottom:8px}
.col{flex:0 0 258px; background:var(--sunken); border:1px solid var(--line); border-radius:var(--radius); display:flex; flex-direction:column}
.col>header{padding:9px 11px; border-bottom:1px solid var(--line)}
.col>header .t{display:flex; align-items:center; gap:7px; font-weight:600; font-size:12.5px}
.col>header .s{color:var(--ink-3); font-size:11px; margin-top:2px; font-family:var(--mono)}
.col .stack{padding:8px; display:flex; flex-direction:column; gap:7px; min-height:56px}
.kcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:9px 10px; cursor:grab}
.kcard:hover{border-color:var(--line-strong)}
.kcard .kt{font-family:var(--mono); font-size:11.5px; font-weight:500}
.kcard .kn{font-size:12px; margin-top:2px}
.kcard .kf{display:flex; align-items:center; gap:6px; margin-top:7px; flex-wrap:wrap}
.kcard .sum{margin-left:auto; font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; font-size:12px}
.kcard.stale{border-left:3px solid var(--crit)}
.emptycol{color:var(--ink-3); font-size:12px; padding:10px; text-align:center}

/* ---------- панель ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:11px}
.kpi{display:flex; flex-direction:column; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 13px; cursor:pointer; text-align:left; width:100%}
.kpi:hover{border-color:var(--line-strong)}
.kpi .k{color:var(--ink-3); font-size:11.5px}
.kpi .v{font:600 25px/1.15 var(--mono); font-variant-numeric:tabular-nums; margin:5px 0 3px; letter-spacing:-.02em}
.kpi .d{font-size:11.5px; display:flex; align-items:center; gap:5px}
.spark{display:flex; align-items:flex-end; gap:3px; height:54px; margin-top:9px}
.spark i{flex:1; background:var(--accent); opacity:.32; border-radius:1px 1px 0 0; min-height:2px}
.spark i.hi{opacity:.9}

/* ---------- історія запусків ---------- */
.steps{display:flex; flex-direction:column; gap:0; font-size:12px}
.step{display:grid; grid-template-columns:22px 1fr auto; gap:9px; padding:7px 0; border-bottom:1px dashed var(--line); align-items:baseline}
.step:last-child{border-bottom:0}
.step .n{font-family:var(--mono); color:var(--ink-3); font-size:11px}
.step .io{color:var(--ink-3); font-family:var(--mono); font-size:11px; margin-top:3px; word-break:break-all}
.step.fail{color:var(--crit)}
.autorow{display:grid; grid-template-columns:1fr auto auto auto; gap:11px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line)}
.autorow:last-child{border-bottom:0}
.autorow .an{display:block; font-weight:600; font-size:12.5px}
.autorow .ad{display:block; color:var(--ink-2); font-size:12px; margin-top:2px}
.lvl{display:flex; border:1px solid var(--line-strong); border-radius:var(--radius); overflow:hidden}
.lvl button{border:0; background:var(--surface); padding:3px 8px; cursor:pointer; font-size:11.5px; color:var(--ink-2); border-right:1px solid var(--line)}
.lvl button:last-child{border-right:0}
.lvl button[aria-pressed="true"]{background:var(--accent); color:#fff; font-weight:600}
.sw{width:34px; height:19px; border-radius:20px; border:1px solid var(--line-strong); background:var(--sunken); position:relative; cursor:pointer; padding:0}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:var(--ink-3); transition:.15s}
.sw[aria-checked="true"]{background:var(--ok-soft); border-color:var(--ok)}
.sw[aria-checked="true"]::after{left:17px; background:var(--ok)}

/* ---------- стани ---------- */
.state{padding:36px 18px; display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center; color:var(--ink-2)}
.state h3{margin:0; font-size:15px; color:var(--ink); font-weight:600}
.state p{margin:0; max-width:44ch; font-size:12.5px}
.sk{background:linear-gradient(90deg,var(--sunken) 25%,var(--line) 50%,var(--sunken) 75%); background-size:200% 100%; animation:sh 1.3s infinite; border-radius:3px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sklist{display:flex; flex-direction:column; gap:9px; padding:14px 0}
.sklist .sk{height:38px}

/* ---------- тост, поповер, демо ---------- */
.toasts{position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:60; max-width:390px}
.toast{
  background:var(--ink); color:var(--paper); padding:10px 13px; border-radius:var(--radius);
  box-shadow:var(--shadow); display:flex; gap:11px; align-items:center; font-size:12.5px;
  animation:tin .18s ease-out;
}
@keyframes tin{from{transform:translateY(8px); opacity:0}to{transform:none; opacity:1}}
.toast button{background:transparent; border:0; color:var(--paper); text-decoration:underline; cursor:pointer; font-weight:600; white-space:nowrap}
.pop{
  position:fixed; z-index:70; max-width:330px; background:var(--surface); border:1px solid var(--line-strong);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 13px; font-size:12.5px;
}
.pop h4{margin:0 0 6px; font-size:12.5px; display:flex; align-items:center; gap:6px}
.pop dl{display:grid; grid-template-columns:auto 1fr; gap:3px 9px; margin:7px 0 0}
.pop dt{color:var(--ink-3); font-size:11.5px}
.pop dd{margin:0; font-size:11.5px}
.pop .close{position:absolute; top:6px; right:8px; border:0; background:transparent; cursor:pointer; color:var(--ink-3); font-size:14px}
.backdrop{position:fixed; inset:0; background:rgba(22,32,43,.42); z-index:65; display:flex; align-items:center; justify-content:center; padding:18px}
.modal{background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius); box-shadow:var(--shadow); max-width:520px; width:100%; max-height:86vh; overflow:auto}
.modal header{padding:13px 15px; border-bottom:1px solid var(--line)}
.modal header h3{margin:0; font-size:14px}
.modal .mb{padding:15px}
.modal footer{padding:11px 15px; border-top:1px solid var(--line); display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.demobar{
  position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:58;
  background:var(--ink); color:var(--paper); padding:9px 15px; border-radius:22px;

}
.demobar button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--paper); border-radius:14px; padding:2px 10px; cursor:pointer; font-size:11.5px}
.demobar .step-n{font-family:var(--mono); opacity:.7; font-size:11px; white-space:nowrap}

function toast(html, undo) {
  const box = $("#toasts"), el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span>${html}</span>` + (undo ? `<button type="button" data-undo="1">Скасувати</button>` : "");
  box.appendChild(el);

  setTimeout(kill, 6500);
}

let demoIx = -1, demoTimer = null;
function demoStep(n) {
  demoIx = n;
  if (n >= DEMO.length) return demoStop();
  const d = DEMO[n];
  if (d.st) Object.assign(S.states, d.st);
  S.screen = d.s; render();
  if (d.act === "gate") setTimeout(approvalGate, 380); else closeModal();
  $("#demoholder").innerHTML = `<div class="demobar">
    <span class="step-n">${n + 1}/${DEMO.length}</span><span>${esc(d.t)}</span>
    <button data-demo="prev" ${n === 0 ? "disabled" : ""}>←</button>
    <button data-demo="next">→</button>
    <button data-demo="stop">Вийти</button>
  </div>`;
  clearTimeout(demoTimer);
  demoTimer = setTimeout(() => demoStep(n + 1), 7000);
}
function demoStop() { clearTimeout(demoTimer); demoIx = -1; $("#demoholder").innerHTML = ""; closeModal(); }

document.addEventListener("click", e => {
  const t = e.target;
  const hit = sel => t.closest(sel);

  if (hit("[data-closepop]")) return closePop();
  if (t.closest(".ai")) { const a = t.closest(".ai"); openPop(a, a.dataset.ai); return; }
  if (!t.closest(".pop")) closePop();

  if (hit("[data-backdrop]") && t.classList.contains("backdrop")) return closeModal();
  if (hit("[data-closemodal]")) return closeModal();
  if (hit("[data-do-post]")) return doPost();

  const nav = hit("[data-go]"); if (nav) return go(nav.dataset.go);

  const seg = hit("[data-seg]"); if (seg) { S.seg = seg.dataset.seg; const f = QUEUE.find(d => d.seg === S.seg); S.sel = f ? f.id : null; return render(); }
  const pick = hit("[data-pick]"); if (pick) { S.sel = pick.dataset.pick; return render(); }
  if (hit("[data-open-verify]")) return go("verify");
  if (hit("[data-next-doc]")) { toast("Наступний документ у черзі — <b>2209/1</b>, ТОВ «Епіцентр К»."); return; }

  const sn = hit("[data-snooze]"); if (sn) {
    const d = QUEUE.find(x => x.id === sn.dataset.snooze), was = d.seg;
    d.seg = "snoozed"; d.age = "відкладено до 01.09, 09:00"; render();
    toast(`<b>${esc(d.doc)}</b> відкладено до завтра, 09:00.`, () => { d.seg = was; render(); });
    return;
  }
  if (hit("[data-handoff]")) { toast("Документ передано <b>Богдану К.</b> Він отримає його у своїй черзі."); return; }
  if (hit("[data-reject]")) {
    modal("Повернути документ постачальнику", `<p style="margin:0 0 11px">Постачальнику <b>ТОВ «Метро Кеш енд Кері Україна»</b> піде лист із зазначенням причини. Документ вийде з черги й отримає статус «повернуто».</p>
      <label class="u" for="rr">Причина — потрапить у лист</label>
      <textarea id="rr" style="width:100%; min-height:74px; margin-top:6px; padding:8px; border:1px solid var(--line-strong); border-radius:var(--radius); background:var(--surface)">Сума рядків не збігається із сумою без ПДВ. Просимо надіслати виправлений примірник.</textarea>`,
      `<button class="btn danger" data-closemodal="1">Повернути постачальнику</button><button class="btn" data-closemodal="1">Скасувати</button>`);
    return;
  }

  const v = hit("[data-view]"); if (v) { S.view = v.dataset.view; S.bulk.clear(); return render(); }
  if (hit("[data-density]")) { S.density = S.density === "dense" ? "normal" : "dense"; return render(); }
  const pr = hit("[data-pickrow]"); if (pr) { const k = pr.dataset.pickrow; S.bulk.has(k) ? S.bulk.delete(k) : S.bulk.add(k); return render(); }
  const bk = hit("[data-bulk]"); if (bk) {
    const a = bk.dataset.bulk;
    if (a === "none") S.bulk.clear();
    else if (a === "all" || a === "page") REGISTRY.forEach(r => S.bulk.add(r.doc));
    else if (a === "post") { toast("Проведено <b>22</b>, пропущено <b>2</b> — немає прав на базу «Буд-Альянс». <a href=\"#\" style=\"color:inherit\">Показати пропущені</a>"); S.bulk.clear(); }
    else if (a === "orig") { toast("Підготовлено <b>24</b> листи-нагадування. Надсилання — після вашого підтвердження."); S.bulk.clear(); }
    else { toast("Файл <b>реєстр_08-2026.xlsx</b> сформовано."); }
    return render();
  }

  const bnk = hit("[data-bank]"); if (bnk) { S.bankSel = bnk.dataset.bank; return render(); }
  if (hit("[data-bank-ok]")) { toast("Рознесено. У BAS створено рух по рахунку — <b>чернетка</b>, проводить головний бухгалтер.", () => toast("Рознесення скасовано.")); return; }
  const bp = hit("[data-bank-pick]"); if (bp) { toast("Платіж зіставлено з <b>рахунком № 1204</b>. Вибір збережено як правило для цього контрагента."); return; }
  if (hit("[data-ask-client]")) { toast("Запит клієнту сформовано. Лист відкриється в чернетках — надсилаєте ви."); return; }

  const ac = hit("[data-act]"); if (ac) { S.actSel = +ac.dataset.act; return render(); }
  if (hit("[data-send-act]")) {
    modal("Надіслати акт звірки", `<dl>
      <div class="frow"><dt>Кому</dt><dd>ТОВ «Епіцентр К» · buh@epicentrk.ua</dd></div>
      <div class="frow"><dt>Канал</dt><dd>Вчасно.ЕДО — з накладенням КЕП</dd></div>
      <div class="frow"><dt>Період</dt><dd>01.07 — 31.08.2026</dd></div>
      <div class="frow"><dt>Сальдо в акті</dt><dd class="num">42 180,00 ₴</dd></div>
    </dl><div class="note warn" style="margin-top:12px"><b>Три розбіжності не закриті.</b> Якщо надіслати зараз, контрагент побачить сальдо, яке ви самі ще не підтвердили.</div>`,
      `<button class="btn" data-closemodal="1">Спершу закрити розбіжності</button><button class="btn primary" data-closemodal="1">Усе одно надіслати</button>`);
    return;
  }
  if (hit("[data-approve-mails]")) {
    modal("Нагадування постачальникам — 6 листів", `<p style="margin:0 0 11px; color:var(--ink-2)">Кожен лист відкривається для правки. Надсилання — одне рішення на весь пакет або поштучно.</p>
      <div class="note" style="margin-bottom:9px"><b>ТОВ «Ашан Україна» · РН-0004702</b><br>«Доброго дня! Нагадуємо про оригінал видаткової накладної № РН-0004702 від 18.08.2026 на суму 22 415,30 грн…»<div style="margin-top:7px; display:flex; gap:7px"><button class="btn sm">Редагувати</button><button class="btn sm">Виключити</button></div></div>
      <div class="note"><b>ТОВ «Оптіма-Фарм» · ОП-3391</b><br>«Доброго дня! Нагадуємо про оригінал видаткової накладної № ОП-3391 від 20.08.2026 на суму 154 900,00 грн…»<div style="margin-top:7px; display:flex; gap:7px"><button class="btn sm">Редагувати</button><button class="btn sm">Виключити</button></div></div>
      <p style="color:var(--ink-3); font-size:12px; margin:11px 0 0">Ліміт: не більше одного листа на контрагента на тиждень — повторне нагадування «Ашану» піде 04.09.</p>`,
      `<button class="btn primary" data-closemodal="1">Надіслати 6 листів</button><button class="btn" data-closemodal="1">Скасувати</button>`);
    return;
  }

  const lvl = hit("[data-lvl]"); if (lvl) {
    const [k, n] = lvl.dataset.lvl.split(":"); const a = AUTOS.find(x => x.key === k);
    a.lvl = +n; render();
    toast(`«${esc(a.name)}» — рівень <b>${["", "радить", "з підтвердженням", "робить сама"][+n]}</b>. Зміна записана в історію налаштувань.`);
    return;
  }
  const tg = hit("[data-toggle]"); if (tg) { const a = AUTOS.find(x => x.key === tg.dataset.toggle); a.on = !a.on; render(); toast(`«${esc(a.name)}» ${a.on ? "увімкнено" : "вимкнено"}.`); return; }
  const rs = hit("[data-runsearch]"); if (rs) { S.runQuery = rs.dataset.runsearch; return render(); }
  const rr = hit("[data-retry-run]"); if (rr) {
    modal("Повторити запуск № 8901", `<div class="note ${rr.dataset.retryRun === "orig" ? "info" : "warn"}" style="margin-bottom:12px">
      ${rr.dataset.retryRun === "orig"
        ? "Повтор <b>з вихідними даними</b>: система візьме той самий документ у тому вигляді, в якому він був о 08:54, і пройде кроки заново."
        : "Повтор <b>з поточною версією</b>: документ буде взято в теперішньому стані, з усіма правками після падіння."}</div>
      <div class="note"><b>Дубля не буде.</b> Перевірка за ключем <span class="num">budal|32490244|ВН|2209/1|2026-08-27</span> виконується перед створенням. Якщо документ уже з'явився в BAS — запуск завершиться зі статусом «уже виконано».</div>`,
      `<button class="btn primary" data-closemodal="1">Повторити</button><button class="btn" data-closemodal="1">Скасувати</button>`);
    return;
  }
  if (hit("[data-run]")) { toast("Розбір запуску показано нижче в картці."); return; }

  const st = hit("[data-retry]"); if (st) { S.states[st.dataset.retry] = "ok"; return render(); }
  if (hit("[data-ask]")) { toast("Запит на доступ надіслано <b>Богдану К.</b> (головний бухгалтер)."); return; }

  const dm = hit("[data-demo]"); if (dm) {
    if (dm.dataset.demo === "stop") return demoStop();
    if (dm.dataset.demo === "next") { clearTimeout(demoTimer); return demoStep(demoIx + 1); }
    clearTimeout(demoTimer); return demoStep(Math.max(0, demoIx - 1));
  }
  if (hit("#demobtn")) return demoStep(0);

  if (hit("#themebtn")) {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? null : "dark";
    if (next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    toast(`Тема: <b>${next === "dark" ? "темна" : next === "light" ? "світла" : "як у системі"}</b>.`);
    return;
  }
  if (hit("#kill")) {
    S.killed = !S.killed;
    if (S.killed) toast("<b>Автоматику зупинено.</b> Приймання працює, проведення й розсилка — ні.", () => { S.killed = false; render(); });
    else toast("Автоматику увімкнено. Черга обробиться протягом 5 хвилин.");
    return render();
  }
  if (hit("#clientpick")) {
    const ix = ["all", ...CLIENTS.map(c => c.id)].indexOf(S.client);
    const list = ["all", ...CLIENTS.map(c => c.id)];
    S.client = list[(ix + 1) % list.length];
    return render();
  }
  if (hit("#rolepick")) {
    S.role = S.role === "operator" ? "chief" : "operator";
    S.screen = S.role === "operator" ? "queue" : "dashboard";
    render();
    toast(S.role === "operator" ? "Роль: <b>оператор вводу</b>. Стартовий екран — черга на перевірку." : "Роль: <b>головний бухгалтер</b>. Стартовий екран — панель.");
    return;
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "runq") { S.runQuery = e.target.value; const v = e.target.value, p = e.target.selectionStart; render(); const n = $("#runq"); if (n) { n.focus(); n.setSelectionRange(p, p); } }
});
document.addEventListener("change", e => {
  const s = e.target.closest("[data-state]");
  if (s) { S.states[s.dataset.state] = s.value; render(); }
});
document.addEventListener("focusin", e => {
  const f = e.target.closest("[data-hl]");
  if (f && S.screen === "verify") { S.verifyHl = f.dataset.hl; const el = $(".hl-" + f.dataset.hl); document.querySelectorAll(".scan .hl").forEach(x => x.classList.remove("hl")); if (el) el.classList.add("hl"); }
});

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#gsearch").focus(); return; }
  if (e.key === "Escape") {
    const overlay = $("#popholder").innerHTML || $("#modalholder").innerHTML;
    closePop(); closeModal();
    if (!overlay && S.screen === "verify") go("queue");
    return;
  }
  const aiEl = e.target.closest && e.target.closest(".ai");
  if (aiEl && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); openPop(aiEl, aiEl.dataset.ai); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && S.screen === "verify") { e.preventDefault(); return approvalGate(); }
  if (typing) return;

  if (S.screen === "queue") {
    const list = QUEUE.filter(d => d.seg === S.seg);
    const i = list.findIndex(d => d.id === S.sel);
    if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); S.sel = list[Math.min(i + 1, list.length - 1)].id; return render(); }
    if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); S.sel = list[Math.max(i - 1, 0)].id; return render(); }
    if (e.key === "Enter") { e.preventDefault(); return go("verify"); }
    if (e.key.toLowerCase() === "s" && list[i]) {
      const d = list[i], was = d.seg; d.seg = "snoozed"; render();
      toast(`<b>${esc(d.doc)}</b> відкладено до завтра, 09:00.`, () => { d.seg = was; render(); });
      return;
    }
  }
  const keys = { "1": "queue", "2": "bank", "3": "registry", "4": "originals", "5": "acts", "6": "automation", "7": "dashboard" };
  if (keys[e.key]) go(keys[e.key]);
});

document.addEventListener("click", e => { if (e.target.id === "confirmbtn" && !S.posted) approvalGate(); });

render();
</script>
<!--ARTIFACT:END-->
</body>
</html>
