<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--ARTIFACT:BEGIN-->
<title>Замовлення Гідросвіт</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ==========================================================================
   Замовлення — прототип обробки замовлень для оптової торгівлі
   ДЕМОНСТРАЦІЙНИЙ РЕЖИМ: тестові дані, підключення до 1С/УНФ немає.
   Палітра: глибокий бірюзовий на холодних нейтралях; зелений/бурштиновий/
   червоний зарезервовані під статуси, фіолетовий — тільки під мітку AI.
   ========================================================================== */
:root{
  --paper:#F1F4F4;
  --surface:#FFFFFF;
  --surface-2:#FAFCFC;
  --sunken:#E7EDED;
  --line:#D4DEDE;
  --line-strong:#B3C2C2;
  --ink:#12201F;
  --ink-2:#455857;
  --ink-3:#748685;
  --accent:#0E6E7A;
  --accent-soft:#DFEFF1;
  --accent-ink:#0A525C;
  --ok:#2E7D3A;    --ok-soft:#E5F2E6;
  --warn:#96600F;  --warn-soft:#FBF1DC;
  --crit:#B03430;  --crit-soft:#FAE8E6;
  --ai:#6D4C9F;    --ai-soft:#EEE9F8;
  --demo:#8A4B12;  --demo-soft:#FCEFE0;
  --focus:#0E6E7A;
  --r:6px;
  --shadow:0 1px 2px rgba(18,32,31,.07), 0 10px 28px rgba(18,32,31,.09);
  --sans:"Commissioner","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono","SF Mono",Consolas,monospace;
  --serif:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1615; --surface:#152020; --surface-2:#1A2726; --sunken:#111A19;
    --line:#263534; --line-strong:#394B4A;
    --ink:#E3EBEA; --ink-2:#A2B3B2; --ink-3:#778987;
    --accent:#48BCC7; --accent-soft:#0E3037; --accent-ink:#84D8E1;
    --ok:#5CBF71;   --ok-soft:#16301C;
    --warn:#DCA352; --warn-soft:#332612;
    --crit:#E4837C; --crit-soft:#37201E;
    --ai:#AE93E2;   --ai-soft:#241C38;
    --demo:#E0A46A; --demo-soft:#33210F;
    --focus:#48BCC7;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1615; --surface:#152020; --surface-2:#1A2726; --sunken:#111A19;
  --line:#263534; --line-strong:#394B4A;
  --ink:#E3EBEA; --ink-2:#A2B3B2; --ink-3:#778987;
  --accent:#48BCC7; --accent-soft:#0E3037; --accent-ink:#84D8E1;
  --ok:#5CBF71;   --ok-soft:#16301C;
  --warn:#DCA352; --warn-soft:#332612;
  --crit:#E4837C; --crit-soft:#37201E;
  --ai:#AE93E2;   --ai-soft:#241C38;
  --demo:#E0A46A; --demo-soft:#33210F;
  --focus:#48BCC7;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--paper); color:var(--ink); font:400 13.5px/1.5 var(--sans); -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:3px}
[hidden]{display:none !important}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.u{text-transform:uppercase; letter-spacing:.08em; font-size:10.5px; font-weight:600; color:var(--ink-3)}

/* ---------------------------------------------------------------- каркас */
.app{display:grid; grid-template-columns:224px 1fr; grid-template-rows:auto 1fr; height:100vh; min-height:0}
.topbar{grid-column:1/-1; display:flex; align-items:center; gap:13px; padding:0 14px; height:52px;
  background:var(--surface); border-bottom:1px solid var(--line); position:relative; z-index:20}
.brand{display:flex; align-items:baseline; gap:8px; width:210px; flex:none}
.brand b{font-size:15.5px; font-weight:700; letter-spacing:-.02em}
.brand span{font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.09em}
.demoflag{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:20px;
  background:var(--demo-soft); color:var(--demo); border:1px solid color-mix(in srgb,var(--demo) 32%,transparent);
  font-size:11.5px; font-weight:600; white-space:nowrap}
.demoflag::before{content:"●"; font-size:8px}
.searchwrap{flex:1; max-width:400px; position:relative}
.searchwrap input{width:100%; padding:6px 10px 6px 29px; background:var(--sunken);
  border:1px solid transparent; border-radius:var(--r); color:var(--ink)}
.searchwrap input::placeholder{color:var(--ink-3)}
.searchwrap input:focus{background:var(--surface); border-color:var(--line-strong); outline:none}
.searchwrap .mag{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-3)}
.searchwrap .kbd{position:absolute; right:7px; top:50%; transform:translateY(-50%)}
.kbd{font:500 10px/1.6 var(--mono); padding:1px 5px; border:1px solid var(--line-strong);
  border-bottom-width:2px; border-radius:3px; color:var(--ink-3); background:var(--surface); white-space:nowrap}
.spacer{flex:1}
.pick{display:flex; align-items:center; gap:6px; padding:5px 9px; background:transparent;
  border:1px solid var(--line); border-radius:var(--r); cursor:pointer}
.pick:hover{border-color:var(--line-strong)}
.pick small{color:var(--ink-3); font-size:11px}
.killswitch{display:flex; align-items:center; gap:7px; padding:5px 10px; cursor:pointer;
  border:1px solid var(--crit); color:var(--crit); background:transparent; border-radius:var(--r); font-weight:600}
.killswitch:hover{background:var(--crit-soft)}
.killswitch.off{border-color:var(--line-strong); color:var(--ink-2)}

.rail{background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column;
  padding:10px 8px; gap:2px; overflow-y:auto; min-height:0}
.rail .u{padding:12px 8px 5px}
.navitem{display:flex; align-items:center; gap:9px; width:100%; padding:6px 9px; border:0;
  background:transparent; border-radius:var(--r); cursor:pointer; text-align:left; color:var(--ink-2)}
.navitem:hover{background:var(--sunken); color:var(--ink)}
.navitem[aria-current="page"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.navitem .ico{width:16px; text-align:center; flex:none; font-size:13px; opacity:.85}
.navitem .cnt{margin-left:auto; font:500 11px/1 var(--mono); color:var(--ink-3)}
.navitem .cnt.hot{color:var(--crit); font-weight:600}
.navitem[aria-current="page"] .cnt{color:var(--accent-ink)}

.main{overflow:auto; min-height:0; display:flex; flex-direction:column}
.screen{display:flex; flex-direction:column; flex:1; min-height:0}
.shead{display:flex; align-items:flex-end; gap:14px; padding:14px 18px 11px; border-bottom:1px solid var(--line);
  background:var(--surface); flex:none; flex-wrap:wrap}
.shead h1{margin:0; font-size:18px; font-weight:600; letter-spacing:-.02em}
.shead .sub{color:var(--ink-3); font-size:12px; margin-top:2px}
.statepick{display:flex; align-items:center; gap:6px; margin-left:auto}
.statepick select{padding:4px 7px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.body{flex:1; min-height:0; overflow:auto; padding:16px 18px 30px}
.body.flush{padding:0; display:flex; min-height:0}

/* ----------------------------------------------------------------- атоми */
.btn{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--r);
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer;
  font-weight:500; white-space:nowrap}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.btn.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink)}
.btn.quiet{border-color:transparent; background:transparent; color:var(--accent-ink)}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.danger{border-color:var(--crit); color:var(--crit)}
.btn.danger:hover{background:var(--crit-soft)}
.btn.sm{padding:3px 8px; font-size:12px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.btn.busy{pointer-events:none; opacity:.75}

.badge{display:inline-flex; align-items:center; gap:5px; padding:1.5px 8px; border-radius:20px;
  font-size:11.5px; font-weight:500; border:1px solid transparent; white-space:nowrap}
.badge .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.b-ok{background:var(--ok-soft); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 26%,transparent)}
.b-warn{background:var(--warn-soft); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 26%,transparent)}
.b-crit{background:var(--crit-soft); color:var(--crit); border-color:color-mix(in srgb,var(--crit) 26%,transparent)}
.b-info{background:var(--accent-soft); color:var(--accent-ink); border-color:color-mix(in srgb,var(--accent) 24%,transparent)}
.b-mute{background:var(--sunken); color:var(--ink-2); border-color:var(--line)}
.b-demo{background:var(--demo-soft); color:var(--demo); border-color:color-mix(in srgb,var(--demo) 30%,transparent)}

.ai{display:inline-flex; align-items:center; gap:4px; padding:0 5px; height:16px; border-radius:3px;
  background:var(--ai-soft); color:var(--ai); border:1px solid color-mix(in srgb,var(--ai) 30%,transparent);
  font:600 9.5px/1 var(--sans); letter-spacing:.07em; cursor:pointer; vertical-align:middle; user-select:none}
.ai:hover{filter:brightness(.96)}
.ai::before{content:"◆"; font-size:7px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.card>.ch{padding:10px 13px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.card>.ch h3{margin:0; font-size:13px; font-weight:600}
.card>.cb{padding:13px}
.grid{display:grid; gap:12px}
.note{padding:9px 12px; border-radius:var(--r); border:1px solid var(--line); background:var(--surface-2);
  color:var(--ink-2); font-size:12.5px}
.note.warn{background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 30%,transparent); color:var(--ink)}
.note.crit{background:var(--crit-soft); border-color:color-mix(in srgb,var(--crit) 30%,transparent); color:var(--ink)}
.note.info{background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 26%,transparent); color:var(--ink)}
.note.demo{background:var(--demo-soft); border-color:color-mix(in srgb,var(--demo) 34%,transparent); color:var(--ink)}
.note b{font-weight:600}

/* ------------------------------------------------------- рейка етапів */
.stagerail{display:grid; grid-template-columns:repeat(4,1fr); gap:0; border:1px solid var(--line);
  border-radius:var(--r); overflow:hidden; background:var(--surface)}
.stage{padding:10px 13px; border-right:1px solid var(--line); position:relative; display:flex;
  flex-direction:column; gap:5px; min-width:0}
.stage:last-child{border-right:0}
.stage::before{content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--line)}
.stage.done::before{background:var(--ok)}
.stage.active::before{background:var(--accent)}
.stage.block::before{background:var(--crit)}
.stage.demo::before{background:var(--demo)}
.stage .sn{display:flex; align-items:center; gap:7px}
.stage .sn i{font-style:normal; font:600 10px/1 var(--mono); color:var(--ink-3); border:1px solid var(--line-strong);
  border-radius:50%; width:16px; height:16px; display:grid; place-items:center; flex:none}
.stage.done .sn i{background:var(--ok); border-color:var(--ok); color:#fff}
.stage.active .sn i{background:var(--accent); border-color:var(--accent); color:#fff}
.stage .sn b{font-size:12.5px; font-weight:600}
.stage .meta{font-size:11.5px; color:var(--ink-2); line-height:1.45}
.stage .who{font-size:11px; color:var(--ink-3); display:flex; align-items:center; gap:5px}
.stage .who .m{color:var(--ai); font-weight:600}

/* ------------------------------------------------------ картка замовлення */
.ordergrid{display:grid; grid-template-columns:292px minmax(0,1fr) 292px; gap:13px; align-items:start}
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); padding:0 3px; margin-bottom:0}
.tab{padding:7px 12px; border:0; background:transparent; cursor:pointer; color:var(--ink-2);
  border-bottom:2px solid transparent; font-size:12.5px; margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent-ink); border-bottom-color:var(--accent); font-weight:600}
dl{margin:0}
.frow{display:grid; grid-template-columns:118px 1fr; gap:9px; padding:5px 13px; align-items:baseline}
.ordergrid .frow{grid-template-columns:104px 1fr}
.frow+.frow{border-top:1px solid var(--line)}
.frow>dt{color:var(--ink-2); font-size:12px}
.frow>dd{margin:0; display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0}
.frow>dd .trunc{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%}

.checks{display:flex; flex-direction:column}
.check{display:grid; grid-template-columns:18px 1fr; gap:8px; padding:7px 13px; align-items:start; font-size:12.5px}
.check+.check{border-top:1px solid var(--line)}
.check .mk{font-size:12px; line-height:1.5; text-align:center}
.check.ok .mk{color:var(--ok)}
.check.warn .mk{color:var(--warn)}
.check.bad .mk{color:var(--crit)}
.check .t{color:var(--ink)}
.check .d{color:var(--ink-3); font-size:11.5px; display:block; margin-top:1px}

table.tbl{border-collapse:separate; border-spacing:0; width:100%; font-size:12.5px}
.tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table.tbl th{position:sticky; top:0; z-index:2; background:var(--surface-2); text-align:left; padding:7px 10px;
  border-bottom:1px solid var(--line-strong); font-weight:600; font-size:10.5px; text-transform:uppercase;
  letter-spacing:.06em; color:var(--ink-3); white-space:nowrap}
table.tbl th.r,table.tbl td.r{text-align:right}
table.tbl td{padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
table.tbl tbody tr:hover td{background:var(--surface-2)}
table.tbl tbody tr[aria-selected="true"] td{background:var(--accent-soft)}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl tfoot td{padding:7px 10px; border-top:1px solid var(--line-strong); font-weight:600; background:var(--surface-2)}
table.tbl .idc{font-family:var(--mono); font-weight:500; white-space:nowrap}
table.tbl.dense td{padding:4px 10px}
.raw{color:var(--ink-3); font-size:11px; display:block; margin-top:2px}
.trunc{max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block}

.toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:11px}
.views{display:flex; gap:4px; flex-wrap:wrap}
.view{padding:4px 10px; border:1px solid var(--line); background:var(--surface); border-radius:20px;
  cursor:pointer; font-size:12px; color:var(--ink-2)}
.view:hover{border-color:var(--line-strong)}
.view[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:600}
.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.chip{display:inline-flex; align-items:center; gap:6px; padding:2.5px 6px 2.5px 9px; border:1px solid var(--line-strong);
  border-radius:20px; background:var(--surface); font-size:12px}
.chip button{border:0; background:transparent; cursor:pointer; color:var(--ink-3); padding:0 2px; line-height:1}
.chip button:hover{color:var(--crit)}
.count{color:var(--ink-3); font-size:12px; margin-left:auto}
.bulkbar{display:flex; align-items:center; gap:9px; padding:8px 12px; margin-bottom:11px;
  background:var(--ink); color:var(--paper); border-radius:var(--r); flex-wrap:wrap}
.bulkbar .btn{background:transparent; border-color:rgba(255,255,255,.35); color:var(--paper)}
.bulkbar .btn:hover{background:rgba(255,255,255,.13)}

/* ------------------------------------------------------- майстер-деталь */
.split{display:grid; grid-template-columns:minmax(320px,390px) 1fr; flex:1; min-height:0}
.split>.left{border-right:1px solid var(--line); overflow-y:auto; background:var(--surface); min-height:0}
.split>.right{overflow-y:auto; min-height:0; background:var(--paper)}
.seg{display:flex; gap:2px; padding:9px 11px; border-bottom:1px solid var(--line); flex-wrap:wrap;
  position:sticky; top:0; background:var(--surface); z-index:3}
.segbtn{padding:4px 9px; border:0; background:transparent; border-radius:var(--r); cursor:pointer;
  font-size:12px; color:var(--ink-2); display:flex; gap:6px; align-items:center}
.segbtn:hover{background:var(--sunken)}
.segbtn[aria-pressed="true"]{background:var(--sunken); color:var(--ink); font-weight:600}
.segbtn i{font-style:normal; font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.segbtn.alarm i{color:var(--crit); font-weight:600}

.qrow{display:flex; flex-direction:column; align-items:stretch; width:100%; text-align:left; border:0;
  border-bottom:1px solid var(--line); background:transparent; padding:10px 12px; cursor:pointer;
  border-left:3px solid transparent}
.qrow:hover{background:var(--surface-2)}
.qrow[aria-selected="true"]{background:var(--accent-soft); border-left-color:var(--accent)}
.qrow .l1{display:flex; align-items:baseline; gap:8px}
.qrow .l1 .onum{font-family:var(--mono); font-weight:600; font-size:13px}
.qrow .l1 .sum{margin-left:auto; font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600}
.qrow .l2{color:var(--ink-2); font-size:12px; margin-top:2px; display:flex; gap:7px; align-items:center; flex-wrap:wrap}
.qrow .l3{margin-top:6px; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.qrow .age{color:var(--ink-3); font-size:11px; font-family:var(--mono)}
.qrow .age.late{color:var(--crit); font-weight:600}
.src{font-size:10.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3);
  border:1px solid var(--line); border-radius:3px; padding:0 4px}

/* ----------------------------------------------------------- документ */
.doc{background:#fff; color:#1b1b1b; font-family:var(--serif); font-size:11.5px; line-height:1.45;
  padding:20px 22px; box-shadow:var(--shadow); border:1px solid var(--line); max-width:620px; margin:0 auto}
.doc h4{margin:0 0 3px; font-size:14px; text-align:center; font-weight:600}
.doc .meta{text-align:center; font-size:10.5px; color:#555; margin-bottom:11px}
.doc .party{margin:6px 0; font-size:11px}
.doc table{width:100%; border-collapse:collapse; margin:9px 0; font-size:10.5px}
.doc th,.doc td{border:1px solid #999; padding:3px 5px; text-align:left}
.doc th{background:#eee; font-weight:600; font-size:9.5px}
.doc td.r,.doc th.r{text-align:right; font-family:var(--mono)}
.doc .tot{text-align:right; margin-top:8px; font-size:11px}
.doc .sig{display:flex; justify-content:space-between; margin-top:18px; font-size:10px; color:#555}
.doc .stamp{margin-top:14px; border:2px dashed #b45309; color:#b45309; padding:6px 10px; text-align:center;
  font-family:var(--sans); font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase}

/* ------------------------------------------------------------- канбан */
.board{display:flex; gap:11px; align-items:flex-start; overflow-x:auto; padding-bottom:8px}
.col{flex:0 0 246px; background:var(--sunken); border:1px solid var(--line); border-radius:var(--r);
  display:flex; flex-direction:column}
.col>header{padding:9px 11px; border-bottom:1px solid var(--line)}
.col>header .t{display:flex; align-items:center; gap:7px; font-weight:600; font-size:12.5px}
.col>header .s{color:var(--ink-3); font-size:11px; margin-top:2px; font-family:var(--mono)}
.col .stack{padding:8px; display:flex; flex-direction:column; gap:7px; min-height:54px}
.kcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:9px 10px;
  cursor:grab; width:100%; text-align:left; display:flex; flex-direction:column; gap:4px}
.kcard:hover{border-color:var(--line-strong)}
.kcard .kt{font-family:var(--mono); font-size:11.5px; font-weight:600}
.kcard .kn{font-size:12px}
.kcard .kf{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.kcard .sum{margin-left:auto; font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; font-size:12px}
.kcard.stale{border-left:3px solid var(--crit)}
.emptycol{color:var(--ink-3); font-size:12px; padding:10px; text-align:center}

/* ------------------------------------------------------------- панель */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(198px,1fr)); gap:11px}
.kpi{display:flex; flex-direction:column; align-items:flex-start; background:var(--surface);

.spark{display:flex; align-items:flex-end; gap:3px; height:54px; margin-top:9px}
.spark i{flex:1; background:var(--accent); opacity:.34; border-radius:1px 1px 0 0; min-height:2px}
.spark i.hi{opacity:.92}

/* --------------------------------------------------- автоматизації, історія */
.autorow{display:grid; grid-template-columns:1fr auto auto auto; gap:11px; align-items:center;
  padding:10px 12px; border-bottom:1px solid var(--line)}
.autorow:last-child{border-bottom:0}
.autorow .an{display:block; font-weight:600; font-size:12.5px}
.autorow .ad{display:block; color:var(--ink-2); font-size:12px; margin-top:2px}
.lvl{display:flex; border:1px solid var(--line-strong); border-radius:var(--r); overflow:hidden}
.lvl button{border:0; background:var(--surface); padding:3px 8px; cursor:pointer; font-size:11.5px;
  color:var(--ink-2); border-right:1px solid var(--line)}
.lvl button:last-child{border-right:0}
.lvl button[aria-pressed="true"]{background:var(--accent); color:#fff; font-weight:600}
.sw{width:34px; height:19px; border-radius:20px; border:1px solid var(--line-strong); background:var(--sunken);
  position:relative; cursor:pointer; padding:0}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%;
  background:var(--ink-3); transition:.15s}
.sw[aria-checked="true"]{background:var(--ok-soft); border-color:var(--ok)}
.sw[aria-checked="true"]::after{left:17px; background:var(--ok)}
.steps{display:flex; flex-direction:column; font-size:12px}
.step{display:grid; grid-template-columns:22px 1fr auto; gap:9px; padding:7px 0;
  border-bottom:1px dashed var(--line); align-items:baseline}
.step:last-child{border-bottom:0}
.step .n{font-family:var(--mono); color:var(--ink-3); font-size:11px}
.step .io{color:var(--ink-3); font-family:var(--mono); font-size:11px; margin-top:3px; word-break:break-all; display:block}
.step.fail{color:var(--crit)}

.fitem+.fitem{border-top:1px solid var(--line)}
.fitem .av{width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:10px;

pre.code .c{color:var(--ink-3)}

.sklist .sk{height:38px}

  el.innerHTML = `<span>${html}</span>` + (undo ? `<button type="button" data-undo="1">Скасувати</button>` : "");
  box.appendChild(el);

}

    t: "1 · Новий заказ. О 09:26 із сайту прийшло замовлення № 7419. Черга відсортована за строком реакції, у рядку одразу видно джерело, клієнта, суму й стан перевірок." },
  { s: "order", pre: () => { S.tab = "goods"; },
    t: "2 · Перевірка даних. Єдина картка: клієнт, товари, кількість, сума, джерело. Ліворуч — 8 перевірок; сьома пройшла, восьму — адресу з вільного тексту — розпізнала модель, і це помічено." },
  { s: "drafts",
    t: "3 · Чернетка для 1С/УНФ. Система зібрала payload «Замовлення покупця» і таблицю відповідності реквізитів. Кнопки «Передати» немає навмисно: підключення до бази немає, і інтерфейс про це говорить прямо." },
  { s: "order", pre: () => { S.tab = "docs"; },
    t: "4 · Документи. Рахунок і видаткова накладна згенеровані з тих самих даних. Рахунок пішов клієнту; накладна залишається чернеткою до передачі в 1С/УНФ." },
  { s: "order", pre: () => { S.tab = "feed"; },
    t: "5 · Оплата й доставка. Рейка етапів угорі: оплата надійшла об 11:04, збірку закрив комірник, ТТН у дорозі. У стрічці видно, хто що зробив — людина чи система." },
  { s: "exceptions",
    t: "6 · Виняток передано менеджеру. Шість випадків, де автоматика зупиняється: борг понад ліміт, немає товару, дубль, знижка понад норму, нерозпізнана адреса, немає ЄДРПОУ. У кожного є власник, строк і варіанти рішення — але не саме рішення." }
];
let demoIx = -1, demoTimer = null, demoTick = null;
const DEMO_MS = 15000;

function demoStep(n) {
  demoIx = n;
  if (n >= DEMO.length) {
    clearInterval(demoTick); clearTimeout(demoTimer);
    $("#demoholder").innerHTML = `<div class="demobar"><span>Демонстрацію завершено. 90 секунд, шість кроків, тестові дані.</span>
      <button data-demo="restart">Спочатку</button><button data-demo="stop">Закрити</button></div>`;
    return;
  }
  const d = DEMO[n];
  if (d.pre) d.pre();
  S.screen = d.s; render(); closeModal(); $("#main").scrollTop = 0;

  $("#demoholder").innerHTML = `<div class="demobar">
    <span class="step-n">${n + 1}/${DEMO.length}</span><span>${esc(d.t)}</span>
    <button data-demo="prev" ${n === 0 ? "disabled" : ""}>←</button>
    <button data-demo="next">→</button>
    <button data-demo="stop">Вийти</button>
    <span class="bar" style="width:0"></span>
  </div>`;

  clearTimeout(demoTimer); clearInterval(demoTick);
  const started = Date.now();
  demoTick = setInterval(() => {
    const bar = document.querySelector(".demobar .bar");
    if (bar) bar.style.width = Math.min(100, (Date.now() - started) / DEMO_MS * 100) + "%";
  }, 120);
  demoTimer = setTimeout(() => demoStep(n + 1), DEMO_MS);
}
function demoStop() { clearTimeout(demoTimer); clearInterval(demoTick); demoIx = -1; $("#demoholder").innerHTML = ""; }

/* ---------------------------------------------------- обробники */
document.addEventListener("click", e => {
  const t = e.target, hit = sel => t.closest(sel);

  if (hit("[data-closepop]")) return closePop();
  if (t.closest(".ai")) { const a = t.closest(".ai"); openPop(a, a.dataset.ai); return; }
  if (!t.closest(".pop")) closePop();

  if (hit("[data-backdrop]") && t.classList.contains("backdrop")) return closeModal();
  if (hit("[data-closemodal]")) return closeModal();
  if (hit("[data-do-confirm]")) return doConfirm();

  const oo = hit("[data-open-order]");
  if (oo) {
    if (oo.dataset.openOrder !== "7419") { toast(`У прототипі детально заповнене одне замовлення — <b>№ 7419</b>. Відкриваю його.`); }
    S.tab = "goods"; return go("order");
  }
  const nav = hit("[data-go]"); if (nav) return go(nav.dataset.go);

  const seg = hit("[data-seg]"); if (seg) { S.seg = seg.dataset.seg; const f = ORDERS.find(o => o.seg === S.seg); S.sel = f ? f.id : null; return render(); }
  const pick = hit("[data-pick]"); if (pick) { S.sel = pick.dataset.pick; return render(); }
  const tab = hit("[data-tab]"); if (tab) { S.tab = tab.dataset.tab; return render(); }
  const cli = hit("[data-cli]"); if (cli) { S.cliSel = cli.dataset.cli; return render(); }
  const exc = hit("[data-exc]"); if (exc) { S.excSel = +exc.dataset.exc; return render(); }

  if (hit("[data-next-order]")) { toast("Наступне в черзі — <b>№ 7424</b>, ТОВ «Аквалайн», 15 680,00 ₴."); return; }
  if (hit("[data-handoff]")) { toast("Замовлення передано <b>Андрію Мельнику</b>. Воно з'явиться в його черзі."); return; }
  if (hit("[data-payload]")) {
    modal("Payload для 1С/УНФ — замовлення № 7419", `
      <div class="note demo" style="margin-bottom:12px">Це те, що піде в УНФ, коли з'явиться підключення. Зараз запит нікуди не надсилається.</div>
      <pre class="code">${esc(PAYLOAD)}</pre>`,
      `<button class="btn" data-closemodal="1">Закрити</button><button class="btn quiet" data-go="drafts">Відкрити розділ чернеток</button>`);
    return;
  }
  if (hit("[data-cancel-order]")) {
    modal("Скасувати замовлення № 7419", `<p style="margin:0 0 11px">Резерв на складі буде знято, рахунок анульовано, клієнту піде повідомлення. Замовлення залишиться в історії зі статусом «Скасовано».</p>
      <label class="u" for="rr">Причина — потрапить у повідомлення клієнту</label>
      <textarea id="rr" style="width:100%; min-height:74px; margin-top:6px; padding:8px; border:1px solid var(--line-strong); border-radius:var(--r); background:var(--surface)">Клієнт попросив скасувати замовлення.</textarea>`,
      `<button class="btn danger" data-closemodal="1">Скасувати замовлення</button><button class="btn" data-closemodal="1">Назад</button>`);
    return;
  }

  if (hit("[data-exc-resolve]")) { const e2 = EXCEPTIONS[S.excSel]; toast(`Виняток по <b>№ ${esc(e2.id)}</b> знято, замовлення повернуто в потік.`, () => toast("Повернення скасовано.")); return; }
  if (hit("[data-exc-escalate]")) { toast("Передано <b>Андрію Мельнику</b> (керівник). Строк реакції — 2 години."); return; }
  if (hit("[data-exc-snooze]")) { toast("Відкладено до завтра, 09:00. Замовлення залишиться у винятках із новим строком.", () => toast("Відкладання скасовано.")); return; }
  if (hit("[data-exc-cancel]")) { toast("Потрібне підтвердження: скасування замовлення незворотне.", null); return; }

  const lvl = hit("[data-lvl]"); if (lvl) {
    const [k, n] = lvl.dataset.lvl.split(":"); const a = AUTOS.find(x => x.key === k);
    a.lvl = +n; render();
    toast(`«${esc(a.name)}» — рівень <b>${["", "радить", "з підтвердженням", "робить сама"][+n]}</b>. Зміна записана в історію налаштувань.`);
    return;
  }
  const tg = hit("[data-toggle]"); if (tg) { const a = AUTOS.find(x => x.key === tg.dataset.toggle); a.on = !a.on; render(); toast(`«${esc(a.name)}» ${a.on ? "увімкнено" : "вимкнено"}.`); return; }
  const rs = hit("[data-runsearch]"); if (rs) { S.runQuery = rs.dataset.runsearch; return render(); }
  const rr = hit("[data-retry-run]"); if (rr) {
    modal("Повторити запуск № 4602", `<div class="note ${rr.dataset.retryRun === "orig" ? "info" : "warn"}" style="margin-bottom:12px">
        ${rr.dataset.retryRun === "orig"
          ? "Повтор <b>з вихідними даними</b>: замовлення береться в тому вигляді, в якому було о 07:02. ЄДРПОУ там усе ще немає — запуск упаде так само."
          : "Повтор <b>з поточними даними</b>: якщо ЄДРПОУ вже заповнено в картці клієнта, чернетка збереться."}</div>
      <div class="note"><b>Дубля не буде.</b> Перед складанням перевіряється ключ <span class="num">prom-2026-08-31-0088</span>. Якщо чернетка вже є — запуск завершиться зі станом «уже виконано».</div>`,
      `<button class="btn primary" data-closemodal="1">Повторити</button><button class="btn" data-closemodal="1">Скасувати</button>`);
    return;
  }
  if (hit("[data-run]")) { toast("Розбір запуску показано нижче в картці."); return; }

  const stt = hit("[data-retry]"); if (stt) { S.states[stt.dataset.retry] = "ok"; return render(); }
  if (hit("[data-ask]")) { toast("Запит на доступ надіслано <b>Андрію Мельнику</b> (керівник відділу)."); return; }

  const dm = hit("[data-demo]"); if (dm) {
    const a = dm.dataset.demo;
    if (a === "stop") return demoStop();
    if (a === "restart") return demoStep(0);
    if (a === "next") { clearTimeout(demoTimer); clearInterval(demoTick); return demoStep(demoIx + 1); }
    clearTimeout(demoTimer); clearInterval(demoTick); return demoStep(Math.max(0, demoIx - 1));
  }
  if (hit("#demobtn")) return demoStep(0);

  if (hit("#themebtn")) {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? null : "dark";
    if (next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    toast(`Тема: <b>${next === "dark" ? "темна" : next === "light" ? "світла" : "як у системі"}</b>.`);
    return;
  }
  if (hit("#kill")) {
    S.killed = !S.killed;
    if (S.killed) toast("<b>Автоматику зупинено.</b> Приймання замовлень працює, формування рахунків і листи — ні.", () => { S.killed = false; render(); });
    else toast("Автоматику увімкнено. Черга обробиться протягом кількох хвилин.");
    return render();
  }
  if (hit("#rolepick")) {
    S.role = S.role === "manager" ? "chief" : "manager";
    S.screen = S.role === "manager" ? "queue" : "dashboard";
    render();
    toast(S.role === "manager" ? "Роль: <b>менеджер клієнтського сервісу</b>. Стартовий екран — черга замовлень." : "Роль: <b>керівник відділу</b>. Стартовий екран — панель.");
    return;
  }
  if (t.id === "confirmbtn" && !S.confirmed) return confirmGate();
});

document.addEventListener("input", e => {
  if (e.target.id === "runq") {
    S.runQuery = e.target.value; const p = e.target.selectionStart; render();
    const n = $("#runq"); if (n) { n.focus(); n.setSelectionRange(p, p); }
  }
});
document.addEventListener("change", e => {
  const s = e.target.closest("[data-state]");
  if (s) { S.states[s.dataset.state] = s.value; render(); }
});

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#gsearch").focus(); return; }
  if (e.key === "Escape") {
    const overlay = $("#popholder").innerHTML || $("#modalholder").innerHTML;
    closePop(); closeModal();
    if (!overlay && S.screen === "order") go("queue");
    return;
  }
  const aiEl = e.target.closest && e.target.closest(".ai");
  if (aiEl && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); openPop(aiEl, aiEl.dataset.ai); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && S.screen === "order") { e.preventDefault(); return confirmGate(); }
  if (typing) return;

  if (S.screen === "queue") {
    const list = ORDERS.filter(o => o.seg === S.seg);
    const i = list.findIndex(o => o.id === S.sel);
    if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); S.sel = list[Math.min(i + 1, list.length - 1)].id; return render(); }
    if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); S.sel = list[Math.max(i - 1, 0)].id; return render(); }
    if (e.key === "Enter") { e.preventDefault(); S.tab = "goods"; return go("order"); }
  }
  const keys = { "1": "queue", "2": "exceptions", "3": "pipeline", "4": "drafts", "5": "clients", "6": "automation", "7": "dashboard" };
  if (keys[e.key]) go(keys[e.key]);
});

render();
</script>

</body>
</html>
