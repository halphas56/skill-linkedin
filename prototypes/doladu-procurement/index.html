<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--ARTIFACT:BEGIN-->
<title>Закупівлі ДОЛАДУ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
/* ==========================================================================
   Закупівлі — прототип закупівельного процесу громадської організації
   під грантові проєкти. ДЕМОНСТРАЦІЙНИЙ РЕЖИМ, дані тестові.
   Акцент — індиго; зелений/вохра/червоний тримають статуси; фіолетовий —
   тільки мітка AI; демо-стрічка інвертована, щоб її не сплутати зі статусом.
   ========================================================================== */
:root{
  --paper:#F1F3F8;
  --surface:#FFFFFF;
  --surface-2:#FAFAFD;
  --sunken:#E7EAF3;
  --line:#D8DCEA;
  --line-strong:#B5BAD1;
  --ink:#171A2B;
  --ink-2:#4B5170;
  --ink-3:#79809B;
  --accent:#3A3F8F;
  --accent-soft:#E5E8F7;
  --accent-ink:#2A2E73;
  --ok:#2C7A46;   --ok-soft:#E3F1E8;
  --warn:#8A6A10; --warn-soft:#F9F1D9;
  --crit:#AE3038; --crit-soft:#FAE6E8;
  --ai:#7C4DA8;   --ai-soft:#F0E9F8;
  --focus:#3A3F8F;
  --r:6px;
  --shadow:0 1px 2px rgba(23,26,43,.07), 0 10px 30px rgba(23,26,43,.10);
  --sans:"Golos Text","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Roboto Mono","SF Mono",Consolas,monospace;
  --serif:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1119; --surface:#161A26; --surface-2:#1B2030; --sunken:#12151F;
    --line:#282E40; --line-strong:#3B4258;
    --ink:#E5E8F2; --ink-2:#A6ADC4; --ink-3:#7B839C;
    --accent:#8B92E8; --accent-soft:#1E2247; --accent-ink:#AFB5F2;
    --ok:#5CBE78;   --ok-soft:#152D1D;
    --warn:#D6AC46; --warn-soft:#302711;
    --crit:#E4838A; --crit-soft:#361F22;
    --ai:#B292DF;   --ai-soft:#241B36;
    --focus:#8B92E8;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1119; --surface:#161A26; --surface-2:#1B2030; --sunken:#12151F;
  --line:#282E40; --line-strong:#3B4258;
  --ink:#E5E8F2; --ink-2:#A6ADC4; --ink-3:#7B839C;
  --accent:#8B92E8; --accent-soft:#1E2247; --accent-ink:#AFB5F2;
  --ok:#5CBE78;   --ok-soft:#152D1D;
  --warn:#D6AC46; --warn-soft:#302711;
  --crit:#E4838A; --crit-soft:#361F22;
  --ai:#B292DF;   --ai-soft:#241B36;
  --focus:#8B92E8;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--paper); color:var(--ink); font:400 13.5px/1.5 var(--sans); -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:3px}
[hidden]{display:none !important}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.03em}
.u{text-transform:uppercase; letter-spacing:.08em; font-size:10.5px; font-weight:600; color:var(--ink-3)}

/* ---------------------------------------------------------------- каркас */
.app{display:grid; grid-template-columns:232px 1fr; grid-template-rows:auto 1fr; height:100vh; min-height:0}
.topbar{grid-column:1/-1; display:flex; align-items:center; gap:13px; padding:0 14px; height:52px;
  background:var(--surface); border-bottom:1px solid var(--line); position:relative; z-index:20}
.brand{display:flex; align-items:baseline; gap:8px; width:218px; flex:none}
.brand b{font-size:15.5px; font-weight:700; letter-spacing:-.02em}
.brand span{font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.1em}
.demoflag{display:inline-flex; align-items:center; gap:7px; padding:3.5px 11px; border-radius:20px;
  background:var(--ink); color:var(--paper); font-size:11.5px; font-weight:600; white-space:nowrap}
.demoflag::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.8}
.searchwrap{flex:1; max-width:380px; position:relative}
.searchwrap input{width:100%; padding:6px 10px 6px 29px; background:var(--sunken); border:1px solid transparent;
  border-radius:var(--r); color:var(--ink)}
.searchwrap input::placeholder{color:var(--ink-3)}
.searchwrap input:focus{background:var(--surface); border-color:var(--line-strong); outline:none}
.searchwrap .mag{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-3)}
.searchwrap .kbd{position:absolute; right:7px; top:50%; transform:translateY(-50%)}
.kbd{font:500 10px/1.6 var(--mono); padding:1px 5px; border:1px solid var(--line-strong); border-bottom-width:2px;
  border-radius:3px; color:var(--ink-3); background:var(--surface); white-space:nowrap}
.spacer{flex:1}
.pick{display:flex; align-items:center; gap:6px; padding:5px 9px; background:transparent; border:1px solid var(--line);
  border-radius:var(--r); cursor:pointer}
.pick:hover{border-color:var(--line-strong)}
.pick small{color:var(--ink-3); font-size:11px}
.killswitch{display:flex; align-items:center; gap:7px; padding:5px 10px; cursor:pointer; border:1px solid var(--crit);
  color:var(--crit); background:transparent; border-radius:var(--r); font-weight:600}
.killswitch:hover{background:var(--crit-soft)}
.killswitch.off{border-color:var(--line-strong); color:var(--ink-2)}

.rail{background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column;
  padding:10px 8px; gap:2px; overflow-y:auto; min-height:0}
.rail .u{padding:12px 8px 5px}
.navitem{display:flex; align-items:center; gap:9px; width:100%; padding:6px 9px; border:0; background:transparent;
  border-radius:var(--r); cursor:pointer; text-align:left; color:var(--ink-2)}
.navitem:hover{background:var(--sunken); color:var(--ink)}
.navitem[aria-current="page"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.navitem .ico{width:16px; text-align:center; flex:none; font-size:13px; opacity:.85}
.navitem .cnt{margin-left:auto; font:500 11px/1 var(--mono); color:var(--ink-3)}
.navitem .cnt.hot{color:var(--crit); font-weight:600}
.navitem[aria-current="page"] .cnt{color:var(--accent-ink)}

.main{overflow:auto; min-height:0; display:flex; flex-direction:column}
.screen{display:flex; flex-direction:column; flex:1; min-height:0}
.shead{display:flex; align-items:flex-end; gap:14px; padding:14px 18px 11px; border-bottom:1px solid var(--line);
  background:var(--surface); flex:none; flex-wrap:wrap}
.shead h1{margin:0; font-size:18px; font-weight:600; letter-spacing:-.02em}
.shead .sub{color:var(--ink-3); font-size:12px; margin-top:2px}
.statepick{display:flex; align-items:center; gap:6px; margin-left:auto}
.statepick select{padding:4px 7px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.body{flex:1; min-height:0; overflow:auto; padding:16px 18px 30px}
.body.flush{padding:0; display:flex; min-height:0}

/* ----------------------------------------------------------------- атоми */
.btn{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--r);
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer;
  font-weight:500; white-space:nowrap}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.btn.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink)}
.btn.quiet{border-color:transparent; background:transparent; color:var(--accent-ink)}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.danger{border-color:var(--crit); color:var(--crit)}
.btn.danger:hover{background:var(--crit-soft)}
.btn.sm{padding:3px 8px; font-size:12px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.btn.busy{pointer-events:none; opacity:.75}

.badge{display:inline-flex; align-items:center; gap:5px; padding:1.5px 8px; border-radius:20px; font-size:11.5px;
  font-weight:500; border:1px solid transparent; white-space:nowrap}
.badge .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.b-ok{background:var(--ok-soft); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 26%,transparent)}
.b-warn{background:var(--warn-soft); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.b-crit{background:var(--crit-soft); color:var(--crit); border-color:color-mix(in srgb,var(--crit) 26%,transparent)}
.b-info{background:var(--accent-soft); color:var(--accent-ink); border-color:color-mix(in srgb,var(--accent) 24%,transparent)}
.b-mute{background:var(--sunken); color:var(--ink-2); border-color:var(--line)}

.ai{display:inline-flex; align-items:center; gap:4px; padding:0 5px; height:16px; border-radius:3px;
  background:var(--ai-soft); color:var(--ai); border:1px solid color-mix(in srgb,var(--ai) 32%,transparent);
  font:600 9.5px/1 var(--sans); letter-spacing:.07em; cursor:pointer; vertical-align:middle; user-select:none}
.ai:hover{filter:brightness(.96)}
.ai::before{content:"◆"; font-size:7px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.card>.ch{padding:10px 13px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.card>.ch h3{margin:0; font-size:13px; font-weight:600}
.card>.cb{padding:13px}
.grid{display:grid; gap:12px}
.note{padding:9px 12px; border-radius:var(--r); border:1px solid var(--line); background:var(--surface-2);
  color:var(--ink-2); font-size:12.5px}
.note.warn{background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 32%,transparent); color:var(--ink)}
.note.crit{background:var(--crit-soft); border-color:color-mix(in srgb,var(--crit) 30%,transparent); color:var(--ink)}
.note.info{background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 26%,transparent); color:var(--ink)}
.note.dark{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.note b{font-weight:600}

dl{margin:0}
.frow{display:grid; grid-template-columns:132px 1fr; gap:9px; padding:5px 13px; align-items:baseline}
.frow+.frow{border-top:1px solid var(--line)}
.frow>dt{color:var(--ink-2); font-size:12px}
.frow>dd{margin:0; display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0}
.narrow .frow{grid-template-columns:110px 1fr}
.trunc{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block}

/* ------------------------------------------------------- бюджетна смуга */
.bar{height:6px; background:var(--sunken); border-radius:3px; overflow:hidden; margin-top:5px}
.bar i{display:block; height:100%; background:var(--accent); border-radius:3px}
.bar i.hot{background:var(--crit)}
.bar i.mid{background:var(--warn)}
.barrow{display:grid; grid-template-columns:1fr auto; gap:5px 10px; padding:8px 13px; font-size:12.5px}
.barrow+.barrow{border-top:1px solid var(--line)}
.barrow .bl{font-weight:500}
.barrow .bv{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; color:var(--ink-2); white-space:nowrap}
.barrow .bar{grid-column:1/-1}
.barrow .bs{grid-column:1/-1; font-size:11px; color:var(--ink-3); font-family:var(--mono)}

/* ---------------------------------------------------------- таблиці */
.tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table.tbl{border-collapse:separate; border-spacing:0; width:100%; font-size:12.5px}
table.tbl th{position:sticky; top:0; z-index:2; background:var(--surface-2); text-align:left; padding:7px 10px;
  border-bottom:1px solid var(--line-strong); font-weight:600; font-size:10.5px; text-transform:uppercase;
  letter-spacing:.06em; color:var(--ink-3); white-space:nowrap}
table.tbl th.r,table.tbl td.r{text-align:right}
table.tbl td{padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
table.tbl tbody tr:hover td{background:var(--surface-2)}
table.tbl tbody tr[aria-selected="true"] td{background:var(--accent-soft)}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl .idc{font-family:var(--mono); font-weight:500; white-space:nowrap; font-size:12px}
.raw{color:var(--ink-3); font-size:11px; display:block; margin-top:2px}

/* ------------------------------------------------ порівняльна таблиця */
.cmpwrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table.cmp{border-collapse:separate; border-spacing:0; width:100%; font-size:12.5px; min-width:640px}
table.cmp th,table.cmp td{padding:8px 11px; border-bottom:1px solid var(--line); vertical-align:top; text-align:left}
table.cmp thead th{background:var(--surface-2); font-size:11.5px; border-bottom:1px solid var(--line-strong)}
table.cmp tbody th{font-weight:500; color:var(--ink-2); font-size:12px; width:180px; background:var(--surface-2)}
table.cmp .win{background:var(--accent-soft)}
table.cmp thead .win{background:var(--accent); color:#fff; border-bottom-color:var(--accent)}
table.cmp thead .win .sup{color:rgba(255,255,255,.82)}
table.cmp .rej{color:var(--ink-3)}
table.cmp .sup{display:block; font-size:11px; color:var(--ink-3); font-weight:400; margin-top:2px}
table.cmp tr:last-child td,table.cmp tr:last-child th{border-bottom:0}
.pricecell{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; font-size:13px}

/* ------------------------------------------------------ маршрут погодження */
.route{list-style:none; padding:0; margin:0}
.rstep{display:grid; grid-template-columns:26px 1fr; gap:11px; padding:0 0 15px; position:relative}
.rstep::before{content:""; position:absolute; left:12px; top:28px; bottom:0; width:2px; background:var(--line)}
.rstep:last-child{padding-bottom:0}
.rstep:last-child::before{display:none}
.rstep .mk{width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center;
  background:var(--surface); font-size:11px; z-index:1; color:var(--ink-3); font-weight:700}
.rstep.done .mk{border-color:var(--ok); background:var(--ok); color:#fff}
.rstep.done::before{background:var(--ok)}
.rstep.wait .mk{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink)}
.rstep.skip .mk{border-style:dashed}
.rstep .who{display:block; font-weight:600; font-size:12.5px}
.rstep .role{display:block; color:var(--ink-2); font-size:12px}
.rstep .when{color:var(--ink-3); font-size:11px; font-family:var(--mono); margin-top:3px; display:block}
.rstep.wait .when{color:var(--crit); font-weight:600}

/* --------------------------------------------------- комплект документів */
.docs{display:flex; flex-direction:column}
.docrow{display:grid; grid-template-columns:22px 1fr auto; gap:10px; padding:9px 13px; align-items:start; font-size:12.5px}
.docrow+.docrow{border-top:1px solid var(--line)}
.docrow .st{font-size:13px; line-height:1.35; text-align:center}
.docrow.have .st{color:var(--ok)}
.docrow.draft .st{color:var(--warn)}
.docrow.none .st{color:var(--ink-3)}
.docrow .t{font-weight:500}
.docrow .d{color:var(--ink-3); font-size:11.5px; display:block; margin-top:2px}
.docrow.none .t{color:var(--ink-2)}

/* --------------------------------------------------------- майстер-деталь */
.split{display:grid; grid-template-columns:minmax(330px,406px) 1fr; flex:1; min-height:0}
.split>.left{border-right:1px solid var(--line); overflow-y:auto; background:var(--surface); min-height:0}
.split>.right{overflow-y:auto; min-height:0; background:var(--paper)}
.seg{display:flex; gap:2px; padding:9px 11px; border-bottom:1px solid var(--line); flex-wrap:wrap;
  position:sticky; top:0; background:var(--surface); z-index:3}
.segbtn{padding:4px 9px; border:0; background:transparent; border-radius:var(--r); cursor:pointer; font-size:12px;
  color:var(--ink-2); display:flex; gap:6px; align-items:center}
.segbtn:hover{background:var(--sunken)}
.segbtn[aria-pressed="true"]{background:var(--sunken); color:var(--ink); font-weight:600}
.segbtn i{font-style:normal; font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.segbtn.alarm i{color:var(--crit); font-weight:600}

.qrow{display:flex; flex-direction:column; align-items:stretch; width:100%; text-align:left; border:0;
  border-bottom:1px solid var(--line); background:transparent; padding:10px 12px; cursor:pointer;
  border-left:3px solid transparent}
.qrow:hover{background:var(--surface-2)}
.qrow[aria-selected="true"]{background:var(--accent-soft); border-left-color:var(--accent)}
.qrow .l1{display:flex; align-items:baseline; gap:8px}
.qrow .l1 .onum{font-family:var(--mono); font-weight:600; font-size:12.5px}
.qrow .l1 .sum{margin-left:auto; font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600}
.qrow .l2{color:var(--ink); font-size:12.5px; margin-top:3px}
.qrow .l2s{color:var(--ink-2); font-size:11.5px; margin-top:2px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.qrow .l3{margin-top:6px; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.qrow .age{color:var(--ink-3); font-size:11px; font-family:var(--mono)}
.qrow .age.late{color:var(--crit); font-weight:600}
.tag{font-size:10.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3);
  border:1px solid var(--line); border-radius:3px; padding:0 4px}

/* --------------------------------------------------------------- вкладки */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); padding:0 3px; flex-wrap:wrap}
.tab{padding:7px 12px; border:0; background:transparent; cursor:pointer; color:var(--ink-2);
  border-bottom:2px solid transparent; font-size:12.5px; margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent-ink); border-bottom-color:var(--accent); font-weight:600}

/* ------------------------------------------------------------- перевірки */
.checks{display:flex; flex-direction:column}
.check{display:grid; grid-template-columns:18px 1fr; gap:8px; padding:7px 13px; align-items:start; font-size:12.5px}
.check+.check{border-top:1px solid var(--line)}
.check .mk{font-size:12px; line-height:1.5; text-align:center}
.check.ok .mk{color:var(--ok)}
.check.warn .mk{color:var(--warn)}
.check.bad .mk{color:var(--crit)}
.check .d{color:var(--ink-3); font-size:11.5px; display:block; margin-top:1px}

/* ------------------------------------------------------------- панель */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:11px}
.kpi{display:flex; flex-direction:column; align-items:flex-start; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 13px; cursor:pointer; text-align:left; width:100%}
.kpi:hover{border-color:var(--line-strong)}
.kpi .k{color:var(--ink-3); font-size:11.5px}
.kpi .v{font:600 25px/1.15 var(--mono); font-variant-numeric:tabular-nums; margin:5px 0 4px; letter-spacing:-.03em}
.spark{display:flex; align-items:flex-end; gap:3px; height:54px; margin-top:9px}
.spark i{flex:1; background:var(--accent); opacity:.32; border-radius:1px 1px 0 0; min-height:2px}
.spark i.hi{opacity:.92}

/* ------------------------------------------------- автоматизації, історія */
.autorow{display:grid; grid-template-columns:1fr auto auto auto; gap:11px; align-items:center; padding:10px 12px;
  border-bottom:1px solid var(--line)}
.autorow:last-child{border-bottom:0}
.autorow .an{display:block; font-weight:600; font-size:12.5px}
.autorow .ad{display:block; color:var(--ink-2); font-size:12px; margin-top:2px}
.lvl{display:flex; border:1px solid var(--line-strong); border-radius:var(--r); overflow:hidden}
.lvl button{border:0; background:var(--surface); padding:3px 8px; cursor:pointer; font-size:11.5px; color:var(--ink-2);
  border-right:1px solid var(--line)}
.lvl button:last-child{border-right:0}
.lvl button[aria-pressed="true"]{background:var(--accent); color:#fff; font-weight:600}
.sw{width:34px; height:19px; border-radius:20px; border:1px solid var(--line-strong); background:var(--sunken);
  position:relative; cursor:pointer; padding:0}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%;
  background:var(--ink-3); transition:.15s}
.sw[aria-checked="true"]{background:var(--ok-soft); border-color:var(--ok)}
.sw[aria-checked="true"]::after{left:17px; background:var(--ok)}
.steps{display:flex; flex-direction:column; font-size:12px}

.step.fail{color:var(--crit)}

.fitem+.fitem{border-top:1px solid var(--line)}

.doc p{margin:7px 0}
.doc table{width:100%; border-collapse:collapse; margin:9px 0; font-size:10.5px}

.sklist{display:flex; flex-direction:column; gap:9px; padding:14px 0}

.pop{position:fixed; z-index:70; max-width:340px; background:var(--surface); border:1px solid var(--line-strong);

.pop .close{position:absolute; top:6px; right:8px; border:0; background:transparent; cursor:pointer; color:var(--ink-3); font-size:14px}

function stateBlock(kind, key) {
  if (kind === "loading") return `<div class="sklist">${'<div class="sk"></div>'.repeat(6)}</div>`;
  if (kind === "empty") return `<div class="state"><h3>Тут порожньо</h3><p>За обраними умовами записів немає. Заявки розібрано, у роботі 31 закупівля.</p><button class="btn" data-go="plan">Відкрити план закупівель</button></div>`;
  if (kind === "error") return `<div class="state"><h3>Не вдалося завантажити дані</h3><p>Сервіс не відповідає більше 30 секунд. Фільтри й введене збережено — після повтору повернетесь у той самий зріз.</p><button class="btn primary" data-retry="${esc(key)}">Повторити</button></div>`;
  if (kind === "noperm") return `<div class="state"><h3>Немає доступу до цього розділу</h3><p>Розділ доступний фінансовій менеджерці й виконавчій директорці. Ваша роль — менеджерка із закупівель.</p><button class="btn" data-ask="1">Запросити доступ</button></div>`;
  return "";
}
function shead(title, sub, key, extra) {
  const st = stateOf(key);
  return `<div class="shead">
    <div><h1>${title}</h1><div class="sub">${sub}</div></div>
    ${extra || ""}
    <div class="statepick">
      <label class="u" for="st-${key}">Стан екрана</label>
      <select id="st-${key}" data-state="${key}">
        ${["ok:робочий", "loading:завантаження", "empty:порожньо", "error:помилка", "noperm:немає доступу"]
          .map(o => { const [v, l] = o.split(":"); return `<option value="${v}"${st === v ? " selected" : ""}>${l}</option>`; }).join("")}
      </select>
    </div>
  </div>`;
}
function barRow(l) {
  const p = pct(l.used, l.limit);
  const cls = p >= 90 ? "hot" : p >= 75 ? "mid" : "";
  return `<div class="barrow">
    <span class="bl">${esc(l.n)}</span>
    <span class="bv">${int(l.used)} / ${int(l.limit)} ₴</span>
    <span class="bar"><i class="${cls}" style="width:${Math.min(100, p)}%"></i></span>
    <span class="bs">використано ${p} % · вільно ${int(l.limit - l.used)} ₴</span>
  </div>`;
}

/* ------------------------------------------------------------- екрани */
function scrRequests() {
  const st = stateOf("requests");
  const head = shead("Заявки на закупівлю", "Що подали команди. Сортування — за строком потреби, а не за датою подання.", "requests");
  if (st !== "ok") return head + `<div class="body">${stateBlock(st, "requests")}</div>`;

  const segs = [
    { k: "new", t: "Нові", n: REQUESTS.filter(r => r.seg === "new").length },
    { k: "exc", t: "Потребують рішення", n: REQUESTS.filter(r => r.seg === "exc").length, alarm: true },
    { k: "work", t: "У роботі", n: REQUESTS.filter(r => r.seg === "work").length }
  ];
  const list = REQUESTS.filter(r => r.seg === S.seg);
  const r = list.find(x => x.id === S.sel) || list[0];

  const rows = list.length ? list.map(x => {
    const pr = projById(x.pid);
    return `<button type="button" class="qrow" role="option" data-pick="${esc(x.id)}" aria-selected="${x.id === (r && r.id)}">
      <span class="l1"><span class="onum">${esc(x.id)}</span><span class="sum num">${money(x.sum)}</span></span>
      <span class="l2">${esc(x.subj)}</span>

      <span class="l3">
        <span class="badge b-${x.lvl}"><span class="dot"></span>${esc(x.note)}</span>
        ${x.ai ? aiMark("У цій заявці модель читала текст пропозиції або звіряла строки — деталі в картці") : ""}
        <span class="age${x.late ? " late" : ""}">${esc(x.age)}</span>
      </span>
    </button>`;
  }).join("") : `<div class="state"><h3>У цьому сегменті порожньо</h3><p>Оберіть інший сегмент угорі.</p></div>`;

  const pr = r ? projById(r.pid) : null;
  const det = r ? `<div style="padding:16px 18px 26px">
      <div class="card" style="margin-bottom:12px">
        <div class="ch"><h3>${esc(r.id)}</h3><span class="badge b-${r.lvl}"><span class="dot"></span>${esc(r.note)}</span></div>
        <dl>
          <div class="frow"><dt>Предмет закупівлі</dt><dd>${esc(r.subj)}</dd></div>
          <div class="frow"><dt>Команда-ініціатор</dt><dd>${esc(r.team)}</dd></div>
          <div class="frow"><dt>Проєкт</dt><dd><span class="tag">${esc(pr.donor)}</span> ${esc(pr.name)} <span class="num" style="color:var(--ink-3)">${esc(pr.code)}</span></dd></div>
          <div class="frow"><dt>Бюджетна лінія</dt><dd>${esc(r.line)}</dd></div>
          <div class="frow"><dt>Сума заявки</dt><dd class="num" style="font-weight:600">${money(r.sum)} ₴</dd></div>
          <div class="frow"><dt>Потрібно до</dt><dd class="num">${esc(r.need)}</dd></div>
          <div class="frow"><dt>Поріг закупівлі</dt><dd>${esc(r.sum < 20000 ? MATRIX[0].band : r.sum < 100000 ? MATRIX[1].band : r.sum < 500000 ? MATRIX[2].band : MATRIX[3].band)} — ${esc(r.sum < 20000 ? MATRIX[0].offers : r.sum < 100000 ? MATRIX[1].offers : r.sum < 500000 ? MATRIX[2].offers : MATRIX[3].offers)}</dd></div>
        </dl>
      </div>
      <div class="note ${r.lvl === "crit" ? "crit" : r.lvl === "warn" ? "warn" : "info"}" style="margin-bottom:12px">
        <b>${r.lvl === "ok" || r.lvl === "info" ? "Що зробила автоматика:" : "Чому зупинилась автоматика:"}</b> ${esc(r.note)}.
      </div>
      <div style="display:flex; gap:9px; flex-wrap:wrap">
        <button class="btn primary" data-open-card="${esc(r.id)}">Відкрити картку закупівлі</button>
        ${r.seg === "exc" ? `<button class="btn" data-go="approvals">Перейти до рішень</button>` : ``}
        <button class="btn" data-handoff="1">Передати колезі</button>
      </div>
      <p style="color:var(--ink-3); font-size:12px; margin-top:12px">Клавіатура: <span class="kbd">↑</span> <span class="kbd">↓</span> — рух, <span class="kbd">Enter</span> — відкрити картку.</p>
    </div>` : `<div class="state"><h3>Нічого не вибрано</h3><p>Оберіть заявку зліва.</p></div>`;

  return head + `<div class="body flush"><div class="split">
    <div class="left">
      <div class="seg" role="tablist">${segs.map(s => `<button type="button" class="segbtn${s.alarm ? " alarm" : ""}" data-seg="${s.k}" aria-pressed="${S.seg === s.k}">${s.t} <i>${s.n}</i></button>`).join("")}</div>
      <div role="listbox" aria-label="Заявки">${rows}</div>
    </div>
    <div class="right">${det}</div>
  </div></div>`;
}

];
let demoIx = -1, demoTimer = null, demoTick = null;
const DEMO_MS = 13000;

function demoStep(n) {
  demoIx = n;
  if (n >= DEMO.length) {
    clearInterval(demoTick); clearTimeout(demoTimer);
    $("#demoholder").innerHTML = `<div class="demobar"><span>Демонстрацію завершено: 90 секунд, сім кроків, тестові дані.</span>
      <button data-demo="restart">Спочатку</button><button data-demo="stop">Закрити</button></div>`;
    return;
  }
  const d = DEMO[n];
  if (d.pre) d.pre();
  S.screen = d.s; render(); closeModal(); $("#main").scrollTop = 0;
  if (d.act === "why") {
    const el = document.querySelectorAll(".card")[document.querySelectorAll(".card").length - 1];
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  $("#demoholder").innerHTML = `<div class="demobar">
    <span class="step-n">${n + 1}/${DEMO.length}</span><span>${esc(d.t)}</span>
    <button data-demo="prev" ${n === 0 ? "disabled" : ""}>←</button>
    <button data-demo="next">→</button>
    <button data-demo="stop">Вийти</button>
    <span class="bar2" style="width:0"></span>
  </div>`;
  clearTimeout(demoTimer); clearInterval(demoTick);
  const started = Date.now();
  demoTick = setInterval(() => {
    const bar = document.querySelector(".demobar .bar2");
    if (bar) bar.style.width = Math.min(100, (Date.now() - started) / DEMO_MS * 100) + "%";
  }, 120);
  demoTimer = setTimeout(() => demoStep(n + 1), DEMO_MS);
}
function demoStop() { clearTimeout(demoTimer); clearInterval(demoTick); demoIx = -1; $("#demoholder").innerHTML = ""; }

/* ---------------------------------------------------------- обробники */
document.addEventListener("click", e => {
  const t = e.target, hit = sel => t.closest(sel);

  if (hit("[data-closepop]")) return closePop();
  if (t.closest(".ai")) { const a = t.closest(".ai"); openPop(a, a.dataset.ai); return; }
  if (!t.closest(".pop")) closePop();

  if (hit("[data-backdrop]") && t.classList.contains("backdrop")) return closeModal();
  if (hit("[data-closemodal]")) return closeModal();
  if (hit("[data-do-sign]")) return doSign();

  const oc = hit("[data-open-card]");
  if (oc) {
    if (oc.dataset.openCard !== "ЗК-2026-0147") toast("У прототипі детально заповнена одна закупівля — <b>ЗК-2026-0147</b>. Відкриваю її.");
    S.tab = "budget"; return go("card");
  }
  const nav = hit("[data-go]"); if (nav) return go(nav.dataset.go);

  const seg = hit("[data-seg]"); if (seg) { S.seg = seg.dataset.seg; const f = REQUESTS.find(r => r.seg === S.seg); S.sel = f ? f.id : null; return render(); }
  const pick = hit("[data-pick]"); if (pick) { S.sel = pick.dataset.pick; return render(); }
  const tab = hit("[data-tab]"); if (tab) { S.tab = tab.dataset.tab; return render(); }
  const as = hit("[data-appr-seg]"); if (as) { S.apprSeg = as.dataset.apprSeg; S.apprSel = APPROVALS.findIndex(a => a.seg === S.apprSeg); return render(); }
  const ap = hit("[data-appr]"); if (ap) { S.apprSel = +ap.dataset.appr; return render(); }
  const pl = hit("[data-plan]"); if (pl) { S.planPid = pl.dataset.plan; return render(); }
  const rg = hit("[data-reg]"); if (rg) { S.regPid = rg.dataset.reg; return render(); }

  if (hit("[data-next-req]")) { toast("Наступна заявка — <b>ЗК-2026-0151</b>, оренда залу, 46 000,00 ₴."); return; }
  if (hit("[data-handoff]")) { toast("Заявку передано <b>Наталі Ковтун</b>. Вона побачить її у своїй черзі."); return; }
  if (hit("[data-return]")) {
    modal("Повернути на доопрацювання", `<p style="margin:0 0 11px">Закупівля повернеться до менеджерки із закупівель. Маршрут зупиниться на поточному кроці, попередні погодження збережуться.</p>
      <label class="u" for="rr">Що треба доопрацювати — побачить менеджерка</label>
      <textarea id="rr" style="width:100%; min-height:74px; margin-top:6px; padding:8px; border:1px solid var(--line-strong); border-radius:var(--r); background:var(--surface)">Уточніть, чи можна отримати гарантію 24 місяці від ІТ-Партнера — тоді різниця в ціні стане суттєвою.</textarea>`,
      `<button class="btn primary" data-closemodal="1">Повернути</button><button class="btn" data-closemodal="1">Скасувати</button>`);
    return;
  }
  if (hit("[data-audit]")) {
    modal("Пакет документів для аудиту", `
      <div class="note" style="margin-bottom:12px">Система збере всі документи закупівель проєкту в один архів з описом і контрольними сумами файлів.</div>
      <dl style="margin:0 -13px">
        <div class="frow"><dt>Проєкт</dt><dd>${esc(projById(S.regPid).name)} (${esc(projById(S.regPid).code)})</dd></div>
        <div class="frow"><dt>Закупівель</dt><dd>${(REGISTRY[S.regPid] || []).length}</dd></div>
        <div class="frow"><dt>Повних комплектів</dt><dd>${(REGISTRY[S.regPid] || []).filter(r => r.docs >= 8).length}</dd></div>
        <div class="frow"><dt>Неповних</dt><dd style="color:var(--crit); font-weight:600">${(REGISTRY[S.regPid] || []).filter(r => r.docs < 8).length} — увійдуть у пакет із позначкою «бракує документів»</dd></div>
      </dl>
      <div class="note warn" style="margin-top:12px">Неповні комплекти <b>не ховаються</b> з пакета. Аудитор побачить їх однаково, а прихований пропуск дорожчий за визнаний.</div>`,
      `<button class="btn primary" data-closemodal="1">Зібрати пакет</button><button class="btn" data-closemodal="1">Скасувати</button>`);
    return;
  }

  if (hit("[data-appr-sign]")) { toast("Погоджено. Закупівля пішла далі маршрутом.", () => toast("Погодження скасовано.")); return; }
  if (hit("[data-appr-return]")) { toast("Повернуто на доопрацювання менеджерці із закупівель."); return; }
  if (hit("[data-appr-resolve]")) {
    const a = APPROVALS[S.apprSel];
    modal("Зафіксувати рішення", `<p style="margin:0 0 11px"><b>${esc(a.id)}</b> · ${esc(a.subj)}</p>
      <div class="note" style="margin-bottom:12px">${esc(a.fix || "")}</div>
      <label class="u" for="dc">Рішення й обґрунтування — потрапить у протокол і в пакет для аудиту</label>
      <textarea id="dc" style="width:100%; min-height:84px; margin-top:6px; padding:8px; border:1px solid var(--line-strong); border-radius:var(--r); background:var(--surface)"></textarea>
      <p style="color:var(--ink-3); font-size:12px; margin:9px 0 0">Обґрунтування обов'язкове: саме воно закриває питання аудитора, а не сам факт рішення.</p>`,
      `<button class="btn primary" data-closemodal="1">Зафіксувати</button><button class="btn" data-closemodal="1">Скасувати</button>`);
    return;
  }
  if (hit("[data-appr-escalate]")) { toast("Передано <b>Марії Демченко</b> (виконавча директорка)."); return; }
  if (hit("[data-appr-cancel]")) { toast("Відхилення закупівлі потребує причини — відкрийте картку й опишіть її."); return; }

  const lvl = hit("[data-lvl]"); if (lvl) {
    const [k, n] = lvl.dataset.lvl.split(":"); const a = AUTOS.find(x => x.key === k);
    a.lvl = +n; render();
    toast(`«${esc(a.name)}» — рівень <b>${["", "радить", "з підтвердженням", "робить сама"][+n]}</b>. Зміна записана в історію налаштувань.`);
    return;
  }
  const tg = hit("[data-toggle]"); if (tg) { const a = AUTOS.find(x => x.key === tg.dataset.toggle); a.on = !a.on; render(); toast(`«${esc(a.name)}» ${a.on ? "увімкнено" : "вимкнено"}.`); return; }
  const rs = hit("[data-runsearch]"); if (rs) { S.runQuery = rs.dataset.runsearch; return render(); }
  const rr = hit("[data-retry-run]"); if (rr) {
    modal("Перевірка постачальника — що далі", `<div class="note ${rr.dataset.retryRun === "orig" ? "info" : "warn"}" style="margin-bottom:12px">

          ? "Повторний запуск звернеться до санкційного джерела ще раз. Якщо воно й далі недоступне, постачальник залишиться в стані «перевірка не завершена»."
          : "Ручна перевірка: ви відкриваєте джерело самі, а до постачальника прикріплюється скріншот і ваш підпис. Це прийнятний доказ для аудиту."}</div>
      <div class="note"><b>Стан постачальника не зміниться сам по собі.</b> Поки перевірка не завершена, закупівлі з ТОВ «Оренда Простір» не рухаються далі маршруту — недоступність джерела не тлумачиться на користь постачальника.</div>`,
      `<button class="btn primary" data-closemodal="1">${rr.dataset.retryRun === "orig" ? "Повторити" : "Перейти до ручної перевірки"}</button><button class="btn" data-closemodal="1">Скасувати</button>`);
    return;
  }
  if (hit("[data-run]")) { toast("Розбір запуску показано нижче в картці."); return; }

  const stt = hit("[data-retry]"); if (stt) { S.states[stt.dataset.retry] = "ok"; return render(); }
  if (hit("[data-ask]")) { toast("Запит на доступ надіслано <b>Наталі Ковтун</b> (фінансова менеджерка)."); return; }

  const dm = hit("[data-demo]"); if (dm) {
    const a = dm.dataset.demo;
    if (a === "stop") return demoStop();
    if (a === "restart") return demoStep(0);

    S.killed = !S.killed;
    if (S.killed) toast("<b>Автоматику зупинено.</b> Заявки приймаються, перевірки й нагадування — ні.", () => { S.killed = false; render(); });
    else toast("Автоматику увімкнено. Черга перевірок обробиться протягом кількох хвилин.");
    return render();
  }
  if (hit("#rolepick")) {
    S.role = S.role === "manager" ? "chief" : "manager";
    S.screen = S.role === "manager" ? "requests" : "dashboard";
    render();
    toast(S.role === "manager" ? "Роль: <b>менеджерка із закупівель</b>. Стартовий екран — заявки." : "Роль: <b>виконавча директорка</b>. Стартовий екран — панель, і з'явилась дія «Погодити закупівлю».");
    return;
  }
  if (t.id === "signbtn" && !S.signed) return signGate();
});

document.addEventListener("input", e => {
  if (e.target.id === "runq") {
    S.runQuery = e.target.value; const p = e.target.selectionStart; render();
    const n = $("#runq"); if (n) { n.focus(); n.setSelectionRange(p, p); }
  }
});
document.addEventListener("change", e => {
  const s = e.target.closest("[data-state]");
  if (s) { S.states[s.dataset.state] = s.value; render(); }
});

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#gsearch").focus(); return; }
  if (e.key === "Escape") {
    const overlay = $("#popholder").innerHTML || $("#modalholder").innerHTML;
    closePop(); closeModal();
    if (!overlay && S.screen === "card") go("requests");
    return;
  }
  const aiEl = e.target.closest && e.target.closest(".ai");
  if (aiEl && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); openPop(aiEl, aiEl.dataset.ai); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && S.screen === "card") { e.preventDefault(); return signGate(); }
  if (typing) return;

  if (S.screen === "requests") {
    const list = REQUESTS.filter(r => r.seg === S.seg);
    const i = list.findIndex(r => r.id === S.sel);
    if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); S.sel = list[Math.min(i + 1, list.length - 1)].id; return render(); }
    if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); S.sel = list[Math.max(i - 1, 0)].id; return render(); }
    if (e.key === "Enter") { e.preventDefault(); S.tab = "budget"; return go("card"); }
  }
  const keys = { "1": "requests", "2": "approvals", "3": "plan", "4": "registry", "5": "suppliers", "6": "automation", "7": "dashboard" };
  if (keys[e.key]) go(keys[e.key]);
});

render();
</script>
